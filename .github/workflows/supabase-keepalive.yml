name: Supabase keep-alive

# Prevents Supabase from pausing the free-tier project for inactivity.
# Lesson from 2026-10-16 (project paused despite gateway pings): the
# pause heuristic is database-centric, so the asserted ping is a real,
# successful anonymous SELECT — the portfolio-proven pattern. It needs a
# one-time grant (supabase/keepalive-grant.sql):
#   grant select on public.dev_notes to anon;
# dev_notes RLS has no anon policy, so this returns 200 + [] — a genuine
# Postgres query with zero data exposure. The key below is the anon key,
# public by design (the same one shipped in index.html).
#
# Alarm contract: anything but 200 fails the run, and a failed run
# emails Matt — covering both a paused project and a dropped grant.
# Auth health is logged as a secondary signal, not asserted.
# workflow_dispatch allows a manual ping after restoring a pause.
#
# Caveat: GitHub disables scheduled workflows after 60 days with no repo
# activity (it emails first; any push or a one-click re-enable re-arms).

on:
  schedule:
    - cron: '23 9 * * 1,4' # Mon + Thu, 09:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0YXRyZmNoZWh4Z3JhdnRqcGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzM1MDEsImV4cCI6MjA5NjMwOTUwMX0.d5yg742obbESwqmiEBYUnkIUNqkz0WWfwVVbWqU6Kuo"
          BASE="https://htatrfchehxgravtjpez.supabase.co"

          # Secondary signal (informational): gateway/auth liveness.
          health=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$BASE/auth/v1/health" -H "apikey: $KEY")
          echo "Auth health responded HTTP $health (informational)"

          # Asserted: a real anonymous SELECT (RLS yields zero rows).
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$BASE/rest/v1/dev_notes?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Database read responded HTTP $code"
          test "$code" = "200"
