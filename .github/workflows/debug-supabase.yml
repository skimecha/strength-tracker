name: Debug Supabase ping (temporary)

# Temporary diagnostic for the keep-alive 401 — manual runs only.
# Will be removed once the keep-alive ping is green.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0YXRyZmNoZWh4Z3JhdnRqcGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzM1MDEsImV4cCI6MjA5NjMwOTUwMX0.d5yg742obbESwqmiEBYUnkIUNqkz0WWfwVVbWqU6Kuo"
          BASE="https://htatrfchehxgravtjpez.supabase.co"
          probe () {
            echo "=== $1"
            shift
            curl -s --max-time 30 -w "\n--> HTTP %{http_code}\n" "$@" | head -c 600
            echo
          }
          probe "rest root, apikey+bearer"  "$BASE/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          probe "rest root, apikey only"    "$BASE/rest/v1/" -H "apikey: $KEY"
          probe "rest root, no auth"        "$BASE/rest/v1/"
          probe "auth health, apikey"       "$BASE/auth/v1/health" -H "apikey: $KEY"
          probe "dev_notes, apikey+bearer"  "$BASE/rest/v1/dev_notes?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
