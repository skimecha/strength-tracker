<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Strength Tracker</title>
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Personal fitness, nutrition and weight tracker">
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --border: #2e3248;
    --text: #f0f2f8;
    --text-muted: #a0a8c0;
    --accent: #4f8ef7;
    --accent-dim: #1e3a6e;
    --green: #3ecf8e;
    --green-dim: #0f3d29;
    --amber: #f59e0b;
    --amber-dim: #3d2a00;
    --red: #f87171;
    --red-dim: #3d1212;
    --purple: #a78bfa;
    --purple-dim: #2d1f5e;
    --radius: 12px;
    --radius-sm: 8px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* NAV */
  .nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .nav-btn { flex: 1; padding: 12px 4px 9px; background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color .15s; }
  .nav-btn svg { width: 20px; height: 20px; }
  .nav-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

  /* VIEWS */
  .view { display: none; flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 24px; }
  .view.active { display: flex; flex-direction: column; gap: 14px; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); margin-bottom: 12px; }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 13px 18px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; color: var(--text); }
  .btn:active { transform: scale(.97); opacity: .8; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-green { background: var(--green); color: #0a1f16; width: 100%; }
  .btn-outline { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--red-dim); border: 1px solid var(--red); color: var(--red); }
  .btn-amber { background: var(--amber-dim); border: 1px solid var(--amber); color: var(--amber); }
  .btn-sm { padding: 8px 12px; font-size: 13px; }
  .btn-xs { padding: 5px 9px; font-size: 12px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-full { width: 100%; }

  /* FORM */
  label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 5px; }
  select, input[type="text"], input[type="number"], textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 11px 14px; font-size: 16px; appearance: none; -webkit-appearance: none;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 5px; }

  /* STEPPER */
  .stepper { display: flex; align-items: stretch; }
  .stepper-val { flex: 1; text-align: center; font-size: 26px; font-weight: 800; background: var(--surface2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 4px; color: var(--text); }
  .stepper-btn { width: 52px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .1s; user-select: none; }
  .stepper-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stepper-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stepper-btn:active { background: var(--border); }
  .increments { display: flex; gap: 5px; margin-top: 6px; }
  .inc-btn { flex: 1; padding: 7px 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: background .1s, color .1s; }
  .inc-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* TOGGLE */
  .toggle-group { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .toggle-opt { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s; color: var(--text-muted); }
  .toggle-opt.active { background: var(--accent); color: #fff; }

  /* MUSCLE GRID */
  .muscle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .muscle-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
  .muscle-btn:active { border-color: var(--accent); background: var(--accent-dim); }

  /* EXERCISE LIST */
  .exercise-list { display: flex; flex-direction: column; gap: 8px; }
  .exercise-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .exercise-item:active { border-color: var(--accent); }
  .exercise-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .fav-star { font-size: 18px; color: var(--text-muted); flex-shrink: 0; padding: 4px; }
  .exercise-item.fav .fav-star { color: var(--amber); }

  /* SET ROWS */
  .set-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; }
  .set-badge { font-size: 11px; font-weight: 800; width: 36px; flex-shrink: 0; text-align: center; }
  .set-badge.warmup { color: var(--amber); }
  .set-badge.working { color: var(--green); }
  .set-info { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
  .set-del { background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer; padding: 4px 6px; }

  /* HISTORY */
  .history-session { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .history-date { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .history-exercise { font-size: 14px; font-weight: 700; color: var(--text); margin: 8px 0 3px; }
  .history-sets { font-size: 13px; color: var(--text-muted); line-height: 1.7; }

  /* MACRO BAR */
  .macro-bar-wrap { background: var(--surface2); border-radius: 6px; overflow: hidden; height: 8px; margin-top: 6px; }
  .macro-bar { height: 100%; border-radius: 6px; transition: width .3s; max-width: 100%; }
  .macro-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 2px; }
  .macro-label { font-weight: 700; color: var(--text-muted); }
  .macro-val { font-weight: 700; color: var(--text); }

  /* WEIGHT CHART */
  .wt-list { display: flex; flex-direction: column; gap: 8px; }
  .wt-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; }
  .wt-date { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .wt-val { font-size: 18px; font-weight: 800; color: var(--text); }
  .wt-del { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; padding: 4px; }

  /* SUMMARY STATS */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
  .stat-val { font-size: 24px; font-weight: 800; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }

  /* MISC */
  .page-header { display: flex; align-items: center; justify-content: space-between; }
  .page-title { font-size: 22px; font-weight: 800; color: var(--text); }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .divider { border: none; border-top: 1px solid var(--border); }
  .empty { text-align: center; color: var(--text-muted); padding: 32px 0; font-size: 14px; }
  .filter-row { display: flex; gap: 8px; align-items: center; }
  .filter-row input { flex: 1; }
  .tag { background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; }
  .tag-green { background: var(--green-dim); color: var(--green); }
  .tag-amber { background: var(--amber-dim); color: var(--amber); }
  .section-gap { display: flex; flex-direction: column; gap: 10px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--green); color: #0a1f16; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: flex; align-items: flex-end; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 20px; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--text); }
  .hidden { display: none !important; }

  /* REST TIMER */
  .timer-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .timer-card.running { border-color: var(--accent); }
  .timer-card.done { border-color: var(--green); }
  .timer-display { text-align: center; font-size: 52px; font-weight: 900; letter-spacing: -.02em; color: var(--text); line-height: 1; padding: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .timer-display.running { color: var(--accent); }
  .timer-display.done { color: var(--green); }
  .timer-presets { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .timer-preset { padding: 10px 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13px; font-weight: 800; cursor: pointer; text-align: center; transition: background .1s, border-color .1s, color .1s; }
  .timer-preset:active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .timer-preset.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .timer-progress { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .timer-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
  .timer-cancel { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; padding: 6px; margin-top: 4px; }
  .fav-del { background: none; border: none; color: var(--amber); font-size: 20px; cursor: pointer; padding: 2px 6px; flex-shrink: 0; line-height: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="nav-wrap"></div>
  <div id="views-wrap" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>
<input type="file" id="csv-file-input" accept=".csv" style="display:none">

<script>
// ─── EXERCISE DATA ────────────────────────────────────────────────────────────
const EXERCISES = {
  'Chest': ['Bench Press - Barbell','Bench Press - Dumbell','Cable Fly','Incline Bench Press - Barbell','Incline Bench Press - Dumbell','Incline Fly - Dumbell','Machine Fly','Machine Press'],
  'Back': ['Cable Row','Deadlift','Deadlift - Romanian','Dumbell Row - One Arm','Face Pulls','Hyperextensions','Machine Row','Reverse Fly - Dumbell','Reverse Fly - Machine','Romainian Deadlift','Row - Barbell','Row - Cable','Row - Dumbell One Arm','T-Bar Row'],

  'Biceps': ['Curls - Dumbell (Decline)','Curls - Dumbell (Incline)','Curls - Dumbell (Standing)','Curls - Preacher (EZ Bar)','Curls - Preacher (Flat Bar)','Curls - Preacher (Machine)','Hammer Curls (Preacher)','Hammer Curls (Standing)'],

// ─── SEEDED SESSIONS (from CSV exports) ──────────────────────────────────────
const SEEDED_SESSIONS = [
  {
    id: 'seed_jun1',
    date: new Date('6/1/2026').getTime(),
    exercises: [
      { muscle: 'Biceps', name: 'Curls - Dumbell (Decline)', sets: [

    exercises: [

      ]},

      ]}
    ]

];

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  view: 'log',
  // Log
  logStep: 'muscle',
  selectedMuscle: null,
  selectedExercise: null,
  setType: 'working',
  weight: 45,
  reps: 10,
  weightInc: 5,
  repsInc: 1,
  pendingSets: [],
  _currentSession: null,
  // Persisted
  sessions: [],
  prs: {},
  favorites: [],
  // Timer
  timer: { remaining: 0, total: 0, interval: null, running: false },
  favFilter: false,
  searchQ: '',
  // Nutrition
  macroGoals: { calories: 2500, protein: 180, carbs: 250, fat: 80 },
  foodLog: [],        // [{id, date, ts, name, calories, protein, carbs, fat}]
  mealFavorites: [],  // [{id, name, calories, protein, carbs, fat}]
  // Weight
  weightLog: [],     // [{id, date, value, unit}]
  weightUnit: 'lbs'
};

// ─── PERSISTENCE — IndexedDB (primary) + localStorage (fallback) ──────────────
const DB_NAME = 'StrengthTrackerDB';
const DB_VER  = 1;
const STORE   = 'appstate';
const LS_KEY  = 'st_backup';
let   _db     = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = () => reject(req.error);
  });
}

function dbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  }));
}

function dbSet(key, val) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(val, key);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  }));
}

function getSnapshot() {
  return {
    sessions: state.sessions, prs: state.prs, favorites: state.favorites,
    macroGoals: state.macroGoals, foodLog: state.foodLog, mealFavorites: state.mealFavorites,
    weightLog: state.weightLog, weightUnit: state.weightUnit
  };
}

function applySnapshot(d) {
  if (!d) return false;
  if (d.sessions)      state.sessions      = d.sessions;
  if (d.prs)           state.prs           = d.prs;
  if (d.favorites)     state.favorites     = d.favorites;
  if (d.macroGoals)    state.macroGoals    = d.macroGoals;
  if (d.foodLog)       state.foodLog       = d.foodLog;
  if (d.mealFavorites) state.mealFavorites = d.mealFavorites;
  if (d.weightLog)     state.weightLog     = d.weightLog;
  if (d.weightUnit)    state.weightUnit    = d.weightUnit;
  return true;
}

function save() {
  const snap = getSnapshot();
  dbSet('state', snap).catch(() => {});
  try { localStorage.setItem(LS_KEY, JSON.stringify(snap)); } catch(e) {}
}

function seedInitialData() {
  state.sessions = SEEDED_SESSIONS;
  state.prs['Curls - Dumbell (Decline)']       = {weight:25,  reps:8,  date:SEEDED_SESSIONS[0].date};

  state.prs['Diverging Lat Pulldown']           = {weight:100, reps:8,  date:SEEDED_SESSIONS[1].date};
  state.weightLog = [{id:'seed_wt1', date:new Date('6/2/2026').getTime(), value:165.5, unit:'lbs'}];
  const d2 = '6/2/2026', d3 = '6/3/2026';
  state.foodLog = [
    {id:'seed_f1', date:d2, ts:new Date('6/2/2026 17:50').getTime(), name:'Latte - 12 oz.',              calories:165, protein:10,  carbs:15, fat:6},
    {id:'seed_f2', date:d2, ts:new Date('6/2/2026 17:51').getTime(), name:'Fiesta Chicken Protein Bowl', calories:480, protein:52,  carbs:10, fat:30},
    {id:'seed_f3', date:d2, ts:new Date('6/2/2026 17:54').getTime(), name:'Steak - Ribeye - 10 oz',      calories:655, protein:65,  carbs:0,  fat:42},
    {id:'seed_f4', date:d3, ts:new Date('6/3/2026 18:09').getTime(), name:'Latte - 12 oz.',              calories:165, protein:10,  carbs:15, fat:6},
    {id:'seed_f5', date:d3, ts:new Date('6/3/2026 18:10').getTime(), name:'Porkchop - 4 oz.',            calories:200, protein:25,  carbs:0,  fat:8},

function load() {
  dbGet('state').then(d => {
    if (d && d.sessions && d.sessions.length > 0) {
      applySnapshot(d);
    } else {
      try {
        const ls = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
        if (ls.sessions && ls.sessions.length > 0) {
          applySnapshot(ls);
          save(); // promote to IndexedDB
          render(); return;
        }
      } catch(e) {}
      seedInitialData();
    }
    render();
  }).catch(() => {
    try {
      const ls = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      if (ls.sessions && ls.sessions.length > 0) applySnapshot(ls);
      else seedInitialData();
    } catch(e) { seedInitialData(); }
    render();
  });
}

function renderExerciseHistory(exercise) {
  // Gather all past sessions that contain this exercise, excluding the current in-progress session
  const past = [];
  state.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      if (ex.name === exercise) {
        const working = ex.sets.filter(s => s.type === 'working');
        if (working.length) past.push({ date: s.date, sets: working });
      }
    });
  });
  if (!past.length) return '';

  // Most recent first, cap at 8
  past.sort((a,b) => b.date - a.date);
  const shown = past.slice(0, 8);

  // Best set per session (highest weight, then reps as tiebreak)
  const overallBest = past.reduce((best, session) => {
    const s = session.sets.reduce((b,s) => s.weight > b.weight || (s.weight===b.weight && s.reps>b.reps) ? s : b, session.sets[0]);
    return s.weight > best.weight || (s.weight===best.weight && s.reps>best.reps) ? s : best;
  }, past[0].sets[0]);

  return `
    <div style="margin-top:8px;border-top:2px dashed var(--border);padding-top:16px">
      <div class="card-title" style="margin-bottom:12px">Past Sessions — ${exercise}</div>
      <div class="section-gap">
        ${shown.map((session, idx) => {
          const best = session.sets.reduce((b,s) => s.weight > b.weight || (s.weight===b.weight && s.reps>b.reps) ? s : b, session.sets[0]);
          const isPR = best.weight === overallBest.weight && best.reps === overallBest.reps;
          return `
          <div style="background:var(--surface);border:1px solid ${idx===0?'var(--accent)':'var(--border)'};border-radius:var(--radius-sm);padding:10px 14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <div style="font-size:12px;font-weight:700;color:${idx===0?'var(--accent)':'var(--text-muted)'}">
                ${idx===0?'Most Recent — ':''}${fmtDate(session.date)}
              </div>
              ${isPR ? `<div style="font-size:10px;font-weight:800;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);border-radius:20px;padding:2px 7px">🏆 PR</div>` : ''}
            </div>
            <div style="font-size:13px;color:var(--text-muted);line-height:1.8">
              ${session.sets.map((s,i) => `<span style="color:var(--text);font-weight:700">${s.weight}lbs</span> × ${s.reps}`).join(' &nbsp;·&nbsp; ')}
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
              Best: ${best.weight}lbs × ${best.reps} &nbsp;·&nbsp; ${session.sets.length} set${session.sets.length!==1?'s':''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

// ── REST TIMER ────────────────────────────────────────────────────────────────
const PRESETS = [30, 60, 90, 120];

function renderTimer() {
  const t = state.timer;
  const pct = t.total > 0 ? (t.remaining / t.total) * 100 : 0;
  const mins = Math.floor(t.remaining / 60);
  const secs = t.remaining % 60;
  const display = t.remaining > 0
    ? (mins > 0 ? `${mins}:${String(secs).padStart(2,'0')}` : `${secs}s`)
    : (t.total > 0 ? 'Rest up!' : 'Rest Timer');
  const stateClass = t.running ? 'running' : (t.total > 0 && t.remaining === 0 ? 'done' : '');

  return `
  <div class="timer-card ${stateClass}">
    <div class="card-title">Rest Timer</div>
    <div class="timer-display ${stateClass}">${display}</div>
    <div class="timer-presets">
      ${PRESETS.map(p => `
        <div class="timer-preset ${t.running && state._lastPreset===p ? 'active' : ''}" data-preset="${p}">
          ${p >= 60 ? (p/60)+'m' : p+'s'}
        </div>`).join('')}
    </div>
    ${t.running ? `
      <div class="timer-progress"><div class="timer-progress-bar" style="width:${pct}%"></div></div>
      <button class="timer-cancel" id="timer-cancel">✕ cancel</button>
    ` : ''}
  </div>`;
}

function timerStart(seconds) {
  timerStop();
  state.timer.remaining = seconds;
  state.timer.total = seconds;
  state.timer.running = true;
  state._lastPreset = seconds;
  state.timer.interval = setInterval(() => {
    state.timer.remaining = Math.max(0, state.timer.remaining - 1);
    if (state.timer.remaining === 0) {
      timerStop(true);
      chime();
    }
    updateTimerDOM();
  }, 1000);
  updateTimerDOM();
}

function timerAdd(seconds) {
  if (!state.timer.running) { timerStart(seconds); return; }
  state.timer.remaining += seconds;
  state.timer.total += seconds;
  state._lastPreset = seconds;
  updateTimerDOM();
}

function timerStop(expired) {
  if (state.timer.interval) { clearInterval(state.timer.interval); state.timer.interval = null; }
  state.timer.running = false;
  if (!expired) { state.timer.remaining = 0; state.timer.total = 0; }
}

function updateTimerDOM() {
  const t = state.timer;
  const card = document.querySelector('.timer-card');
  if (!card) return;
  const pct = t.total > 0 ? (t.remaining / t.total) * 100 : 0;
  const mins = Math.floor(t.remaining / 60);
  const secs = t.remaining % 60;
  const display = t.remaining > 0
    ? (mins > 0 ? `${mins}:${String(secs).padStart(2,'0')}` : `${secs}s`)
    : 'Rest up!';
  const stateClass = t.running ? 'running' : (t.remaining === 0 && t.total > 0 ? 'done' : '');

  const disp = card.querySelector('.timer-display');
  if (disp) { disp.textContent = display; disp.className = `timer-display ${stateClass}`; }
  card.className = `timer-card ${stateClass}`;

  const bar = card.querySelector('.timer-progress-bar');
  if (bar) bar.style.width = pct + '%';

  // Show/hide cancel button
  const cancelBtn = card.querySelector('#timer-cancel');
  if (t.running && !cancelBtn) {
    const prog = card.querySelector('.timer-progress');
    if (!prog) {
      const presetsEl = card.querySelector('.timer-presets');
      const progDiv = document.createElement('div');
      progDiv.className = 'timer-progress';
      progDiv.innerHTML = `<div class="timer-progress-bar" style="width:${pct}%"></div>`;
      presetsEl.after(progDiv);
      const cancelEl = document.createElement('button');
      cancelEl.className = 'timer-cancel';
      cancelEl.id = 'timer-cancel';
      cancelEl.textContent = '✕ cancel';
      cancelEl.addEventListener('click', () => { timerStop(false); updateTimerDOM(); });
      progDiv.after(cancelEl);
    }
  } else if (!t.running && cancelBtn) {
    const prog = card.querySelector('.timer-progress');
    if (prog) prog.remove();
    cancelBtn.remove();
  }
}

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Two-tone pleasant chime: high note then slightly lower
    [[880, 0, 0.15], [1108, 0.18, 0.15], [880, 0.36, 0.2]].forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    });
    setTimeout(() => ctx.close(), 1000);
  } catch(e) {}
}

function renderHistory() {
  const sessions = [...state.sessions].reverse();
  const resuming = !!state._currentSession;
  return `
    <div class="page-header">
      <div class="page-title">Workout History</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" id="import-csv-btn">⬆ Import</button>
        ${sessions.length ? `<button class="btn btn-outline btn-sm" id="export-csv">⬇ Export All</button>` : `<button class="btn btn-outline btn-sm" id="export-csv" style="opacity:.4" disabled>⬇ Export All</button>`}
      </div>
    </div>
    ${sessions.length===0 ? '<div class="empty">No workouts logged yet.</div>' :
      sessions.map(s=>`
        <div class="history-session">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div class="history-date" style="margin-bottom:0">${fmtDate(s.date)}</div>
            <button class="btn btn-outline btn-xs resume-btn" data-resume="${s.id || s.date}" ${resuming ? 'disabled title="Finish your current workout first"' : ''} style="${resuming?'opacity:.4;cursor:not-allowed':''}">↩ Resume</button>
          </div>
          ${s.exercises.map(ex=>`
            <div class="history-exercise">${ex.muscle} — ${ex.name}</div>
            <div class="history-sets">${ex.sets.map(set=>`${set.type==='warmup'?'WU':'●'} ${set.weight}lbs × ${set.reps}`).join('  ')}</div>
          `).join('')}
        </div>`).join('')}`;
}

function resumeSession(sessionId) {
  // Find the session by id or date (legacy sessions without id)
  const s = state.sessions.find(s => (s.id || String(s.date)) === String(sessionId));
  if (!s) return;
  if (state._currentSession) {
    toast('Finish your current workout first', 'var(--red)'); return;
  }
  // Load the session as the active session, remove it from history so it doesn't duplicate on save
  state._currentSession = { id: s.id || uid(), date: s.date, exercises: JSON.parse(JSON.stringify(s.exercises)) };
  state.sessions = state.sessions.filter(x => (x.id || x.date) !== (s.id || s.date));
  // Pre-select muscle/exercise to the last one logged so user lands on the exercise list
  const last = s.exercises[s.exercises.length - 1];
  state.selectedMuscle = last.muscle;
  state.selectedExercise = null;
  state.pendingSets = [];
  state.logStep = 'exercise';
  state.view = 'log';
  save();
  toast('Workout resumed — add more exercises or finish');
  render();
}

// ── RECORDS ───────────────────────────────────────────────────────────────────
function renderRecords() {
  const prs = Object.entries(state.prs).sort((a,b)=>a[0].localeCompare(b[0]));
  return `
    <div class="page-title">Personal Records</div>
    ${prs.length===0 ? '<div class="empty">No records yet.</div>' :
      `<div class="section-gap">
        ${prs.map(([ex,pr])=>`
          <div class="card" style="padding:12px 14px">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">${ex}</div>
            <div style="font-size:22px;font-weight:800;color:var(--text)">${pr.weight} lbs × ${pr.reps}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:3px">${fmtDate(pr.date)}</div>
          </div>`).join('')}
      </div>`}`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function attachEvents() {
  // Nav
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click',()=>{ state.view=b.dataset.nav; render(); });
  });

  // Finish from muscle screen (resume path)
  el('finish-from-muscle', () => {
    if(state._currentSession?.exercises?.length) { state.sessions.push(state._currentSession); save(); toast('Workout saved! 💪'); }
    state._currentSession=null; state.pendingSets=[]; state.logStep='muscle'; state.view='history'; render();
  });

  // Muscle select
  document.querySelectorAll('[data-muscle]').forEach(b=>{
    b.addEventListener('click',()=>{ state.selectedMuscle=b.dataset.muscle; state.searchQ=''; state.logStep='exercise'; render(); });
  });

  // Exercise select
  document.querySelectorAll('[data-exercise]').forEach(b=>{
    b.addEventListener('click',e=>{ if(e.target.closest('[data-fav]')) return; state.selectedExercise=b.dataset.exercise; state.pendingSets=[]; state.logStep='sets'; render(); });
  });

  // Fav toggle
  document.querySelectorAll('[data-fav]').forEach(b=>{
    b.addEventListener('click',e=>{ e.stopPropagation(); const ex=b.dataset.fav; const idx=state.favorites.indexOf(ex); if(idx>=0) state.favorites.splice(idx,1); else state.favorites.push(ex); save(); render(); });
  });

  // Back
  el('back-muscle', ()=>{ state.logStep='muscle'; state.searchQ=''; render(); });
  el('back-exercise', ()=>{ state.logStep='exercise'; render(); });

  // Search
  on('ex-search','input',e=>{ state.searchQ=e.target.value; render(); });

  // Fav filter
  el('fav-filter',()=>{ state.favFilter=!state.favFilter; render(); });

  // Set type toggle
  document.querySelectorAll('[data-toggle]').forEach(b=>{
    b.addEventListener('click',()=>{ state.setType=b.dataset.toggle; render(); });
  });

  // Weight unit
  document.querySelectorAll('[data-wunit]').forEach(b=>{
    b.addEventListener('click',()=>{ state.weightUnit=b.dataset.wunit; save(); render(); });
  });

  // Steppers (inline update for responsiveness)
  document.querySelectorAll('[data-adj]').forEach(b=>{
    b.addEventListener('click',()=>{
      const dir=parseInt(b.dataset.dir);
      if(b.dataset.adj==='weight') { state.weight=Math.max(0,state.weight+dir*state.weightInc); const el=document.getElementById('sv-weight'); if(el) el.textContent=state.weight; }
      else { state.reps=Math.max(1,state.reps+dir*state.repsInc); const el=document.getElementById('sv-reps'); if(el) el.textContent=state.reps; }
    });
  });

  document.querySelectorAll('[data-winc]').forEach(b=>{
    b.addEventListener('click',()=>{ state.weightInc=parseInt(b.dataset.winc); document.querySelectorAll('[data-winc]').forEach(x=>x.classList.toggle('active',parseInt(x.dataset.winc)===state.weightInc)); });
  });
  document.querySelectorAll('[data-rinc]').forEach(b=>{
    b.addEventListener('click',()=>{ state.repsInc=parseInt(b.dataset.rinc); document.querySelectorAll('[data-rinc]').forEach(x=>x.classList.toggle('active',parseInt(x.dataset.rinc)===state.repsInc)); });
  });

  // Timer presets
  document.querySelectorAll('[data-preset]').forEach(b => {
    b.addEventListener('click', () => timerAdd(parseInt(b.dataset.preset)));
  });
  el('timer-cancel', () => { timerStop(false); updateTimerDOM(); });

  // Log set
  el('log-set',()=>{ state.pendingSets.push({type:state.setType,weight:state.weight,reps:state.reps}); toast(`Set logged: ${state.weight}lbs × ${state.reps}`); render(); });

  // Delete set
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>{ state.pendingSets.splice(parseInt(b.dataset.del),1); render(); });
  });

  // Next exercise
  el('next-exercise',()=>{ commitExercise(); state.logStep='exercise'; render(); });
  el('new-muscle',()=>{ commitExercise(); state.logStep='muscle'; render(); });

  // Finish
  el('finish-workout',()=>{
    commitExercise();
    if(state._currentSession?.exercises?.length) { state.sessions.push(state._currentSession); save(); toast('Workout saved! 💪'); }
    state._currentSession=null; state.pendingSets=[]; state.logStep='muscle'; state.view='history'; render();
  });

  // Cancel
  el('cancel-workout',()=>{
    if(confirm('Cancel workout? Unsaved sets will be lost.')) { state._currentSession=null; state.pendingSets=[]; state.logStep='muscle'; render(); }
  });

  // Resume session
  document.querySelectorAll('.resume-btn').forEach(b => {
    b.addEventListener('click', () => { if (!b.disabled) resumeSession(b.dataset.resume); });
  });

  // Export / Import
  el('export-csv', exportAllCSV);
  el('import-csv-btn', () => document.getElementById('csv-file-input').click());
  const fileInput = document.getElementById('csv-file-input');
  if (fileInput) {
    fileInput.value = '';
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => showImportConfirmModal(ev.target.result, file.name);
      reader.readAsText(file);
      fileInput.value = '';
    });
  }

  // Nutrition
  el('edit-goals-btn', showGoalsModal);
  el('add-food-btn', showAddFoodModal);

  document.querySelectorAll('[data-del-food]').forEach(b=>{
    b.addEventListener('click',()=>{ state.foodLog=state.foodLog.filter(e=>e.id!==b.dataset.delFood); save(); render(); });
  });

  // Star a logged entry as a meal favorite
  document.querySelectorAll('[data-fav-food]').forEach(b => {
    b.addEventListener('click', () => {
      const entry = state.foodLog.find(e => e.id === b.dataset.favFood);
      if (!entry) return;
      if (isMealFav(entry)) {
        state.mealFavorites = state.mealFavorites.filter(f => !(f.name===entry.name && f.calories===entry.calories && f.protein===entry.protein));
        toast('Removed from favorites');
      } else {
        state.mealFavorites.push({id:uid(), name:entry.name, calories:entry.calories, protein:entry.protein, carbs:entry.carbs, fat:entry.fat});
        toast('Saved as favorite ★');
      }
      save(); render();
    });
  });

  // Log a favorite instantly
  document.querySelectorAll('[data-log-fav]').forEach(b => {
    b.addEventListener('click', () => {
      const fav = state.mealFavorites.find(f => f.id === b.dataset.logFav);
      if (!fav) return;
      state.foodLog.push({id:uid(), date:todayKey(), ts:Date.now(), name:fav.name, calories:fav.calories, protein:fav.protein, carbs:fav.carbs, fat:fav.fat});
      save(); toast(`Logged: ${fav.name}`); render();
    });
  });

  // Remove a meal favorite
  document.querySelectorAll('[data-del-fav]').forEach(b => {
    b.addEventListener('click', () => {
      state.mealFavorites = state.mealFavorites.filter(f => f.id !== b.dataset.delFav);
      save(); render();
    });
  });

  el('export-nutrition-csv', exportAllCSV);

  // Weight log
  el('log-weight-btn',()=>{
    const input=document.getElementById('wt-input');
    const val=parseFloat(input.value);
    if(!val||val<=0) { toast('Enter a valid weight','var(--red)'); return; }
    state.weightLog.push({id:uid(),date:Date.now(),value:val,unit:state.weightUnit});
    save(); toast('Weight logged!'); render();
  });

  document.querySelectorAll('[data-del-wt]').forEach(b=>{
    b.addEventListener('click',()=>{ state.weightLog=state.weightLog.filter(e=>e.id!==b.dataset.delWt); save(); render(); });
  });

  el('export-weight-csv', exportAllCSV);
}

function el(id, fn) { const e=document.getElementById(id); if(e) e.addEventListener('click',fn); }
function on(id, ev, fn) { const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); }

function commitExercise() {
  if(!state.pendingSets.length) return;
  if(!state._currentSession) state._currentSession={id:uid(),date:Date.now(),exercises:[]};
  const working=state.pendingSets.filter(s=>s.type==='working');
  if(working.length) {
    const best=working.reduce((a,b)=>b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps)?b:a);
    const pr=state.prs[state.selectedExercise];
    if(!pr||best.weight>pr.weight||(best.weight===pr.weight&&best.reps>pr.reps)) {
      state.prs[state.selectedExercise]={weight:best.weight,reps:best.reps,date:Date.now()};
      toast('🏆 New PR!','var(--amber)');
    }
  }
  state._currentSession.exercises.push({muscle:state.selectedMuscle,name:state.selectedExercise,sets:[...state.pendingSets]});
  state.pendingSets=[];
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = filename; a.click();
  toast('Exported! 📥');
}

function exportAllCSV() {
  const date = new Date().toISOString().slice(0,10);
  const rows = [];
  const blank = ['','','','','','',''];

  rows.push(['WORKOUTS','','','','','','']);
  rows.push(['Date','Muscle Group','Exercise','Set Type','Set #','Weight (lbs)','Reps']);
  state.sessions.forEach(s => {
    const d = new Date(s.date).toLocaleDateString('en-US');
    s.exercises.forEach(ex => {
      let wu=0, wk=0;
      ex.sets.forEach(set => {
        if (set.type==='warmup') wu++; else wk++;
        rows.push([d, ex.muscle, ex.name, set.type, set.type==='warmup'?wu:wk, set.weight, set.reps]);
      });
    });
  });

  rows.push(blank);
  rows.push(['PERSONAL RECORDS','','','','','','']);
  rows.push(['Exercise','Weight (lbs)','Reps','Date','','','']);
  Object.entries(state.prs).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([ex,pr]) => {
    rows.push([ex, pr.weight, pr.reps, fmtDate(pr.date), '', '', '']);
  });

  rows.push(blank);
  rows.push(['BODY WEIGHT','','','','','','']);
  rows.push(['Date','Weight (lbs)','Weight (kg)','','','','']);
  [...state.weightLog].sort((a,b)=>a.date-b.date).forEach(e => {
    const lbs = e.unit==='lbs' ? e.value : kgToLbs(e.value);
    const kg  = e.unit==='kg'  ? e.value : lbsToKg(e.value);
    rows.push([fmtDate(e.date), lbs, kg, '', '', '', '']);
  });

  rows.push(blank);
  rows.push(['NUTRITION','','','','','','']);
  rows.push(['Date','Time','Food / Meal','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)']);
  [...state.foodLog].sort((a,b)=>a.ts-b.ts).forEach(e => {
    rows.push([e.date, fmtTime(e.ts), e.name, e.calories, e.protein, e.carbs, e.fat]);
  });

  rows.push(blank);
  rows.push(['MACRO GOALS','','','','','','']);
  rows.push(['Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','','','']);
  rows.push([state.macroGoals.calories, state.macroGoals.protein, state.macroGoals.carbs, state.macroGoals.fat, '', '', '']);

  if (state.mealFavorites.length) {
    rows.push(blank);

    state.mealFavorites.forEach(f => {
      rows.push([f.name, f.calories, f.protein, f.carbs, f.fat, '', '']);
    });
  }

  downloadCSV(rows, `fitness-export-${date}.csv`);
}

// ─── CSV IMPORT ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

function parseImportedCSV(text) {
  const rows = parseCSV(text);
  const result = { sessions: [], prs: {}, weightLog: [], foodLog: [], macroGoals: null, mealFavorites: [] };
  let section = null;
  // Track workout rows to reconstruct sessions
  const workoutRows = [];

  for (const row of rows) {
    const first = row[0] || '';
    // Section headers
    if (first === 'WORKOUTS')         { section = 'workouts'; continue; }
    if (first === 'PERSONAL RECORDS') { section = 'prs'; continue; }
    if (first === 'BODY WEIGHT')      { section = 'weight'; continue; }
    if (first === 'NUTRITION')        { section = 'nutrition'; continue; }
    if (first === 'MACRO GOALS')      { section = 'macrogoals'; continue; }
    if (first === 'MEAL FAVORITES')   { section = 'mealfavs'; continue; }
    // Skip blank rows and header rows
    if (!first || first === 'Date' || first === 'Exercise' || first === 'Calories (kcal)' || first === 'Name') continue;

    if (section === 'workouts') {
      workoutRows.push({ date: row[0], muscle: row[1], exercise: row[2], type: row[3], setNum: parseInt(row[4])||1, weight: parseFloat(row[5])||0, reps: parseInt(row[6])||0 });
    } else if (section === 'prs') {
      if (row[0] && row[1]) {
        const d = row[3] ? new Date(row[3]).getTime() : Date.now();
        result.prs[row[0]] = { weight: parseFloat(row[1])||0, reps: parseInt(row[2])||0, date: isNaN(d) ? Date.now() : d };
      }
    } else if (section === 'weight') {
      if (row[0] && row[1]) {
        result.weightLog.push({ id: uid(), date: new Date(row[0]).getTime() || Date.now(), value: parseFloat(row[1])||0, unit: 'lbs' });
      }
    } else if (section === 'nutrition') {
      if (row[0] && row[2]) {
        result.foodLog.push({ id: uid(), date: row[0], ts: Date.now(), name: row[2], calories: parseInt(row[3])||0, protein: parseFloat(row[4])||0, carbs: parseFloat(row[5])||0, fat: parseFloat(row[6])||0 });
      }
    } else if (section === 'macrogoals') {
      if (row[0]) result.macroGoals = { calories: parseInt(row[0])||2500, protein: parseInt(row[1])||180, carbs: parseInt(row[2])||250, fat: parseInt(row[3])||80 };
    } else if (section === 'mealfavs') {
      if (row[0]) result.mealFavorites.push({ id: uid(), name: row[0], calories: parseInt(row[1])||0, protein: parseFloat(row[2])||0, carbs: parseFloat(row[3])||0, fat: parseFloat(row[4])||0 });
    }
  }

  // Reconstruct sessions from flat workout rows
  const sessionMap = {};
  workoutRows.forEach(r => {
    if (!sessionMap[r.date]) sessionMap[r.date] = { id: uid(), date: new Date(r.date).getTime() || Date.now(), exercises: [] };
    const sess = sessionMap[r.date];
    let ex = sess.exercises.find(e => e.name === r.exercise && e.muscle === r.muscle);
    if (!ex) { ex = { muscle: r.muscle, name: r.exercise, sets: [] }; sess.exercises.push(ex); }
    ex.sets.push({ type: r.type, weight: r.weight, reps: r.reps });
  });
  result.sessions = Object.values(sessionMap).sort((a,b) => a.date - b.date);

  return result;
}

function showImportConfirmModal(csvText, filename) {
  let parsed;
  try { parsed = parseImportedCSV(csvText); }
  catch(e) { toast('Could not parse CSV — check the file format', 'var(--red)'); return; }

  const sessCount   = parsed.sessions.length;
  const prCount     = Object.keys(parsed.prs).length;
  const wtCount     = parsed.weightLog.length;
  const foodCount   = parsed.foodLog.length;
  const favCount    = parsed.mealFavorites.length;

  if (!sessCount && !wtCount && !foodCount) {
    toast('No recognizable data found in file', 'var(--red)'); return;
  }

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-title" style="color:var(--amber)">⚠ Confirm Import</div>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.6">
          <strong style="color:var(--text)">${filename}</strong> contains:
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:13px;line-height:2">
          ${sessCount ? `<div>💪 <strong>${sessCount}</strong> workout session${sessCount!==1?'s':''}</div>` : ''}
          ${prCount   ? `<div>🏆 <strong>${prCount}</strong> personal record${prCount!==1?'s':''}</div>` : ''}
          ${wtCount   ? `<div>⚖️ <strong>${wtCount}</strong> body weight entr${wtCount!==1?'ies':'y'}</div>` : ''}
          ${foodCount ? `<div>🥗 <strong>${foodCount}</strong> nutrition entr${foodCount!==1?'ies':'y'}</div>` : ''}
          ${favCount  ? `<div>★ <strong>${favCount}</strong> meal favorite${favCount!==1?'s':''}</div>` : ''}
        </div>
        <div style="background:var(--red-dim);border:1px solid var(--red);border-radius:var(--radius-sm);padding:12px;font-size:13px;color:var(--red);font-weight:700">
          This will replace ALL current data. This cannot be undone.<br>Export your data first if you want a backup.
        </div>
        <div style="font-size:13px;color:var(--text-muted)">Type <strong style="color:var(--text)">IMPORT</strong> to confirm:</div>
        <input type="text" id="import-confirm-input" placeholder="Type IMPORT" style="text-align:center;font-size:16px;font-weight:800;letter-spacing:.1em">
        <div class="btn-grid">
          <button class="btn btn-outline" id="modal-cancel">Cancel</button>
          <button class="btn btn-danger" id="confirm-import-btn">Replace All Data</button>
        </div>
      </div>
    </div>`;

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
  document.getElementById('import-confirm-input').focus();

  document.getElementById('confirm-import-btn').addEventListener('click', () => {
    const val = document.getElementById('import-confirm-input').value.trim();
    if (val !== 'IMPORT') { toast('Type IMPORT (all caps) to confirm', 'var(--red)'); return; }

    // Apply imported data
    state.sessions      = parsed.sessions;
    state.prs           = parsed.prs;
    state.weightLog     = parsed.weightLog;
    state.foodLog       = parsed.foodLog;
    state.mealFavorites = parsed.mealFavorites;
    if (parsed.macroGoals) state.macroGoals = parsed.macroGoals;
    state._currentSession = null;
    state.pendingSets = [];
    state.logStep = 'muscle';
    state.view = 'history';
    save();
    closeModal();
    toast('Data imported successfully ✓');
    render();
  });
}
