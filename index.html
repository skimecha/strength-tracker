<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>Lock In: Strength</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#232635;--border:#2e3248;
  --text:#f0f2f8;--text-muted:#a0a8c0;
  --accent:#4f8ef7;--accent-dim:#1e3a6e;
  --green:#3ecf8e;--green-dim:#0f3d29;
  --amber:#f59e0b;--amber-dim:#3d2a00;
  --red:#f87171;--red-dim:#3d1212;
  --radius:12px;--radius-sm:8px;
}
html.light{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f7;--border:#d8dde9;
  --text:#161922;--text-muted:#5b6478;
  --accent:#2f6fe0;--accent-dim:#dde9fd;
  --green:#1fa971;--green-dim:#d6f3e6;
  --amber:#c9780a;--amber-dim:#fbe9c8;
  --red:#dc4747;--red-dim:#fbdada;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

/* ── LOADING ── */
#screen-loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── AUTH ── */
#screen-auth{min-height:100vh;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.auth-title{font-size:22px;font-weight:900;color:var(--text);text-align:center}
.auth-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-top:-6px}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.auth-link{text-align:center;font-size:13px;color:var(--accent);cursor:pointer;background:none;border:none;padding:4px;width:100%}
.btn-google{background:#fff;color:#333;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;width:100%;padding:13px;border:1px solid #ddd;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;transition:opacity .15s}
.btn-google:active{opacity:.8}
.auth-msg{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:none}
.auth-msg.error{background:var(--red-dim);border:1px solid var(--red);color:var(--red);display:block}
.auth-msg.success{background:var(--green-dim);border:1px solid var(--green);color:var(--green);display:block}

/* ── APP ── */
#screen-app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;display:none;flex-direction:column}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:9px 4px 12px;background:none;border:none;border-top:2px solid transparent;color:var(--text-muted);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav-btn svg{width:20px;height:20px}
.nav-btn.active{color:var(--accent);border-top:2px solid var(--accent)}
.view{display:none;flex:1;overflow-y:auto;padding:16px;padding-bottom:24px}
.view.active{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;color:var(--text)}
.btn:active{transform:scale(.97);opacity:.8}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-green{background:var(--green);color:#0a1f16;width:100%}
.btn-outline{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--red-dim);border:1px solid var(--red);color:var(--red)}
.btn-amber{background:var(--amber-dim);border:1px solid var(--amber);color:var(--amber)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px}
.btn-full{width:100%}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:5px}
select,input[type=text],input[type=number],input[type=email],input[type=password],textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:11px 14px;font-size:16px;appearance:none;-webkit-appearance:none}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px}
.stepper{display:flex;align-items:stretch}
.stepper-val{flex:1;text-align:center;font-size:26px;font-weight:800;background:var(--surface2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 4px;color:var(--text)}
.stepper-btn{width:52px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s;user-select:none}
.stepper-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.stepper-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.stepper-btn:active{background:var(--border)}
.increments{display:flex;gap:5px;margin-top:6px}
.inc-btn{flex:1;padding:7px 2px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:background .1s,color .1s}
.inc-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.toggle-group{display:flex;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.toggle-opt{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,color .15s;color:var(--text-muted)}
.toggle-opt.active{background:var(--accent);color:#fff}
.select{appearance:none;-webkit-appearance:none;background-color:var(--surface2);background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='12'%20height='12'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23808aa0'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpolyline%20points='6%209%2012%2015%2018%209'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:16px;padding:11px 34px 11px 14px;width:100%;cursor:pointer}
.muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.muscle-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.muscle-btn:active{border-color:var(--accent);background:var(--accent-dim)}
.mbtn-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:8px}
.exercise-list{display:flex;flex-direction:column;gap:8px}
.exercise-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.exercise-item:active{border-color:var(--accent)}
.exercise-name{font-size:14px;font-weight:600;color:var(--text)}
.fav-star{font-size:18px;color:var(--text-muted);flex-shrink:0;padding:4px}
.exercise-item.fav .fav-star{color:var(--amber)}
.set-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px}
.set-badge{font-size:11px;font-weight:800;width:36px;flex-shrink:0;text-align:center}
.set-badge.warmup{color:var(--amber)}
.set-badge.working{color:var(--green)}
.set-info{flex:1;font-size:15px;font-weight:600;color:var(--text)}
.set-del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px 6px}
.history-session{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.history-date{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px}
.history-exercise{font-size:14px;font-weight:700;color:var(--text);margin:8px 0 3px}
.history-sets{font-size:13px;color:var(--text-muted);line-height:1.7}
.macro-bar-wrap{background:var(--surface2);border-radius:6px;overflow:hidden;height:8px;margin-top:6px}
.macro-bar{height:100%;border-radius:6px;transition:width .3s;max-width:100%}
.macro-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:2px}
.macro-label{font-weight:700;color:var(--text-muted)}
.macro-val{font-weight:700;color:var(--text)}
.wt-list{display:flex;flex-direction:column;gap:8px}
.wt-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px}
.wt-date{font-size:13px;color:var(--text-muted);font-weight:600}
.wt-val{font-size:18px;font-weight:800;color:var(--text)}
.wt-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-val{font-size:24px;font-weight:800;color:var(--text)}
.stat-label{font-size:11px;color:var(--text-muted);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.page-header{display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:22px;font-weight:800;color:var(--text)}
.subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.divider{border:none;border-top:1px solid var(--border)}
.empty{text-align:center;color:var(--text-muted);padding:32px 0;font-size:14px}
.filter-row{display:flex;gap:8px;align-items:center}
.filter-row input{flex:1}
.section-gap{display:flex;flex-direction:column;gap:10px}
.fav-del{background:none;border:none;color:var(--amber);font-size:20px;cursor:pointer;padding:2px 6px;flex-shrink:0;line-height:1}
.pr-card:active{border-color:var(--accent)}
.period-btn{flex-shrink:0;padding:5px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;transition:background .1s,color .1s,border-color .1s}
.period-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.timer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.timer-card.running{border-color:var(--accent)}
.timer-card.done{border-color:var(--green)}
.timer-display{text-align:center;font-size:52px;font-weight:900;letter-spacing:-.02em;color:var(--text);line-height:1;padding:6px 0 10px;font-variant-numeric:tabular-nums}
.timer-display.running{color:var(--accent)}
.timer-display.done{color:var(--green)}
.timer-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.timer-preset{padding:10px 4px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:13px;font-weight:800;cursor:pointer;text-align:center;transition:background .1s,border-color .1s,color .1s}
.timer-preset:active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.timer-preset.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.timer-progress{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:10px}
.timer-progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width 1s linear}
.timer-cancel{background:none;border:none;color:var(--text-muted);font-size:12px;font-weight:700;cursor:pointer;width:100%;padding:6px;margin-top:4px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#0a1f16;padding:10px 20px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.modal-title{font-size:18px;font-weight:800;color:var(--text)}
.hidden{display:none!important}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://htatrfchehxgravtjpez.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0YXRyZmNoZWh4Z3JhdnRqcGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MzM1MDEsImV4cCI6MjA5NjMwOTUwMX0.d5yg742obbESwqmiEBYUnkIUNqkz0WWfwVVbWqU6Kuo';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'lockin-auth' }
});

function setTheme(t){ const light=(t==='light'); state.theme=t; localStorage.setItem('li_theme',t); document.documentElement.classList.toggle('light',light); const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=light?'#f4f6fb':'#0f1117'; }
function toggleTheme(){ setTheme(state.theme==='light'?'dark':'light'); render(); }
// Version number + quick light/dark toggle, shown in every section header.
function versionStamp(){ return `<div style="display:flex;align-items:center;gap:6px"><div style="font-size:10px;color:var(--text-muted);font-weight:600">v${APP_VERSION}</div><button onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode" style="background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:0;color:var(--text-muted)">${state.theme==='light'?'🌙':'☀️'}</button></div>`; }
function isOwner(){ return currentUser?.id === OWNER_UID; }
// Owner-only metrics. The call is gated client-side on isOwner() so a normal
// user's browser never even makes the request — but the real lock is the
// server: admin_metrics() (security definer) checks auth.uid() and returns
// null to anyone who isn't the owner, so the data is unreachable even if the
// client check is bypassed. See supabase/admin-metrics.sql.
let _adminLoaded=false;
async function loadAdminMetrics(){
  if(!isOwner()||_adminLoaded) return;
  _adminLoaded=true;
  try{
    const {data,error}=await sb.rpc('admin_metrics');
    if(!error&&data){ state.adminMetrics=data; if(state.view==='admin') render(); }
    else _adminLoaded=false;  // allow a retry next time More opens (e.g. SQL not deployed yet)
  }catch(e){ _adminLoaded=false; }
}
// Owner-only engagement metrics over state.activityDays. Same server gate as
// admin_metrics. Returns counts only (never which users), owner excluded.
let _activityLoading=false;
async function loadAdminActivity(){
  if(!isOwner()||_activityLoading) return;
  _activityLoading=true;
  try{
    const {data,error}=await sb.rpc('admin_activity',{p_days:state.activityDays});
    if(!error&&data) state.adminActivity=data;
  }catch(e){}
  _activityLoading=false;
  if(state.view==='admin') render();
}
// Dev notes live in Supabase (public read, owner-only write). Loaded for every
// user so the More page shows them; falls back to the hardcoded DEV_NOTES below
// if the table isn't present yet (e.g. before dev-notes-setup.sql is run).
async function loadDevNotes(){
  try{
    const dn=await sb.from('dev_notes').select('id,note_date,title,body').order('created_at',{ascending:false});
    if(!dn.error&&Array.isArray(dn.data))
      state.devNotes=dn.data.map(r=>({id:r.id,date:r.note_date,title:r.title,body:r.body}));
  }catch(e){ /* keep fallback */ }
}
function getDevNotes(){ return (state.devNotes&&state.devNotes.length)?state.devNotes:DEV_NOTES; }
async function postDevNote(){
  if(!isOwner()) return;
  const v=id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
  const note_date=v('note-date')||todayStamp(), title=v('note-title'), body=v('note-body');
  if(!title||!body){ toast('Title and body are required','var(--red)'); return; }
  const btn=document.getElementById('note-post-btn'); if(btn){ btn.disabled=true; btn.textContent='Publishing…'; }
  const {error}=await sb.from('dev_notes').insert({note_date,title,body});
  if(error){ toast('Post failed: '+error.message,'var(--red)'); if(btn){ btn.disabled=false; btn.textContent='Publish Note'; } return; }
  await loadDevNotes(); toast('Note published'); render();
}
async function deleteDevNote(noteId){
  if(!isOwner()||!noteId) return;
  if(!confirm('Delete this note? This cannot be undone.')) return;
  const {error}=await sb.from('dev_notes').delete().eq('id',noteId);
  if(error){ toast('Delete failed: '+error.message,'var(--red)'); return; }
  await loadDevNotes(); toast('Note deleted'); render();
}
// Support tickets — owner-only read/triage. Server-locked by RLS (only the
// owner UID can select/update/delete support_messages), so this is unreachable
// to anyone else even if the client gate is bypassed. See
// supabase/support-tickets-setup.sql.
let _supportLoaded=false;
async function loadSupportTickets(force){
  if(!isOwner()) return;
  if(_supportLoaded&&!force) return;
  _supportLoaded=true; state.supportError=null;
  try{
    // select('*') + client-side sort so a briefly-stale PostgREST schema cache
    // (e.g. right after adding the created_at/resolved columns) can't error out
    // a server-side .order() on a column it hasn't picked up yet.
    const r=await sb.from('support_messages').select('*');
    if(r.error) throw r.error;
    const rows=Array.isArray(r.data)?r.data.slice():[];
    rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
    state.supportTickets=rows;
  }catch(e){
    // Keep _supportLoaded=true so the render() below (and renderAdmin's own
    // loadSupportTickets call) don't re-trigger the load and spin into an
    // infinite render/fetch loop. Only the Retry button (force=true) re-attempts.
    state.supportError=(e&&(e.message||e.hint||e.code))||'Unknown error';
    console.error('loadSupportTickets failed:',e);
  }
  if(state.view==='support'||state.view==='admin') render();
}
async function setTicketResolved(id,val){
  if(!isOwner()||!id) return;
  const {error}=await sb.from('support_messages').update({resolved:val}).eq('id',id);
  if(error){ toast('Update failed: '+error.message,'var(--red)'); return; }
  await loadSupportTickets(true); toast(val?'Marked resolved':'Reopened'); render();
}
async function deleteTicket(id){
  if(!isOwner()||!id) return;
  if(!confirm('Delete this ticket? This cannot be undone.')) return;
  const {error}=await sb.from('support_messages').delete().eq('id',id);
  if(error){ toast('Delete failed: '+error.message,'var(--red)'); return; }
  await loadSupportTickets(true); toast('Ticket deleted'); render();
}

const APP_VERSION = '2.22.0';
const OWNER_UID     = '031a65ed-f52d-4a67-b271-47778e920c22';
// Invite code from the URL (?invite=CODE) — drives the invite-only signup flow.
let pendingInvite = new URLSearchParams(location.search).get('invite');
function clearInviteParam(){ pendingInvite=null; try{ history.replaceState({},'',location.pathname); }catch(e){} }

// ─── GROUPS & EXERCISES ───────────────────────────────────────────────────────
const GROUPS = {
  'Chest':     ['Chest'],
  'Back':      ['Back','Lats'],
  'Shoulders': ['Delts (Front)','Delts (Middle)','Delts (Rear)'],
  'Arms':      ['Biceps','Triceps','Forearms / Grip'],
  'Core':      ['Abdominals'],
  'Legs':      ['Quads','Hamstrings','Glutes','Calves','Hips']
};

// ─── AUTH ─────────────────────────────────────────────────────────────────────
function showLoading(){ document.getElementById('screen-loading').style.display='flex'; document.getElementById('screen-auth').style.display='none'; document.getElementById('screen-app').style.display='none'; }
function showAuth(view='login'){ document.getElementById('screen-loading').style.display='none'; document.getElementById('screen-auth').style.display='flex'; document.getElementById('screen-app').style.display='none'; renderAuth(view); }
function showApp(){ document.getElementById('screen-loading').style.display='none'; document.getElementById('screen-auth').style.display='none'; document.getElementById('screen-app').style.display='flex'; render(); }

async function initAuth(){
  showLoading();
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ currentUser=session.user; await loadUserData(); showApp(); }
  else showAuth(pendingInvite ? 'invite' : 'login');

  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){ currentUser=session.user; await loadUserData(); showApp(); }
    else if(event==='SIGNED_OUT'){ currentUser=null; resetAppState(); showAuth('login'); }
    else if(event==='PASSWORD_RECOVERY') showAuth('reset');
  });
}

function resetAppState(){
  state.sessions=[]; state.prs={}; state.favorites=[]; state.exerciseSettings={}; state.planTargets={hypertrophy:{},strength:{}};
  state.foodLog=[]; state.mealFavorites=[]; state.weightLog=[];
  state.macroGoals={calories:2500,protein:180,carbs:250,fat:80};
  state.logStep='type'; state._currentSession=null; state.pendingSets=[]; state.view='log';
  swStop(); state.cardio={activity:null,stopwatch:{running:false,elapsed:0,interval:null},distance:'',distUnit:'mi',heartRate:null,hrTestStep:'idle',hrTestCountdown:0,hrTestInterval:null,hrBeats:''};
  state.adminMetrics=null; _adminLoaded=false; state.adminActivity=null; state.devNotes=null; state.supportTickets=null; state.supportError=null; _supportLoaded=false;
}

async function loadUserData(){
  if(!currentUser) return;
  const userId = currentUser.id;
  try {
    const [s,p,f,mf,w,mg,ef,ce] = await Promise.all([
      sb.from('sessions').select('*').eq('user_id',userId).order('date'),
      sb.from('personal_records').select('*').eq('user_id',userId),
      sb.from('food_log').select('*').eq('user_id',userId).order('ts'),
      sb.from('meal_favorites').select('*').eq('user_id',userId),
      sb.from('weight_log').select('*').eq('user_id',userId).order('date'),
      sb.from('macro_goals').select('*').eq('user_id',userId).maybeSingle(),
      sb.from('exercise_favorites').select('*').eq('user_id',userId),
      sb.from('custom_exercises').select('*').eq('user_id',userId)
    ]);

    const errs = [s,p,f,mf,w,mg,ef,ce].map(r=>r.error).filter(Boolean);
    if(errs.length){
      const msg = errs[0].message || errs[0].code || 'Unknown error';
      toast('DB error: '+msg,'var(--red)');
      console.error('Supabase errors:', errs);
      return;
    }

    state.sessions      = s.data  || [];
    state.prs           = (p.data || []).reduce((acc,r)=>{ acc[r.exercise]={weight:parseFloat(r.weight),reps:parseInt(r.reps),date:r.date}; return acc; },{});
    state.foodLog       = f.data  || [];
    state.mealFavorites = mf.data || [];
    state.weightLog     = w.data  || [];
    state.macroGoals    = mg.data || {calories:2500,protein:180,carbs:250,fat:80};
    state.favorites     = (ef.data|| []).map(r=>r.exercise);
    state.customExercises = ce.data || [];
    // Plan targets — loaded separately so a missing table never aborts the main data load.
    try{ const pg=await sb.from('plan_targets').select('targets').eq('user_id',userId).maybeSingle(); const raw=(pg.data&&pg.data.targets)||{}; state.planTargets=(raw.hypertrophy||raw.strength)?{hypertrophy:raw.hypertrophy||{},strength:raw.strength||{}}:{hypertrophy:raw,strength:{}}; }catch(e){ state.planTargets={hypertrophy:{},strength:{}}; }
    await loadDevNotes();  // separate so a missing dev_notes table never aborts the main load
    // Per-exercise settings (assisted flag). Isolated so a missing table never aborts the load.
    try{ const es=await sb.from('exercise_settings').select('exercise,assisted').eq('user_id',userId); if(!es.error&&Array.isArray(es.data)){ const m={}; es.data.forEach(r=>{ m[r.exercise]={assisted:!!r.assisted}; }); state.exerciseSettings=m; } }catch(e){ state.exerciseSettings={}; }
    console.log('Loaded — sessions:',state.sessions.length,'prs:',Object.keys(state.prs).length);
  } catch(err){
    console.error('loadUserData exception:',err);
    toast('Load error: '+err.message,'var(--red)');
  }
}

function authMsg(msg,type='error'){
  const el=document.getElementById('auth-msg');
  if(!el) return;
  el.textContent=msg; el.className='auth-msg '+(type==='success'?'success':'error');
}

function attachAuthEvents(view){
  const el=(id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click',fn); };
  const on=(id,ev,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); };
  on('a-pass','keydown',e=>{ if(e.key==='Enter') document.getElementById('btn-login')?.click()||document.getElementById('btn-join')?.click(); });

  if(view==='login'){
    el('btn-login', async()=>{
      const email=document.getElementById('a-email').value.trim();
      const pass=document.getElementById('a-pass').value;
      if(!email||!pass){ authMsg('Please enter email and password'); return; }
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) authMsg(error.message);
    });
    el('btn-google', handleGoogleAuth);
    el('link-forgot',()=>renderAuth('forgot'));
  } else if(view==='invite'){
    el('btn-join', async()=>{
      const email=document.getElementById('a-email').value.trim();
      const pass=document.getElementById('a-pass').value;
      if(!email||!pass){ authMsg('Enter your email and a password'); return; }
      if(pass.length<8){ authMsg('Password must be at least 8 characters'); return; }
      const btn=document.getElementById('btn-join'); btn.disabled=true; btn.textContent='Joining…';
      try{
        await redeemInvite(pendingInvite, email, pass);
        authMsg('Welcome to Lock In! Signing you in…','success');
        const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error){ authMsg('Account created — please sign in.'); renderAuth('login'); }
        else clearInviteParam();  // onAuthStateChange takes it from here
      }catch(e){
        authMsg(e.message||'Could not join — check your invite link.');
        btn.disabled=false; btn.textContent='Join Lock In';
      }
    });
    el('link-login',()=>renderAuth('login'));
  } else if(view==='forgot'){
    el('btn-forgot', async()=>{
      const email=document.getElementById('a-email').value.trim();
      if(!email){ authMsg('Please enter your email'); return; }
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://lockinstrength.com'});
      if(error) authMsg(error.message);
      else authMsg('Reset link sent — check your email','success');
    });
    el('link-login',()=>renderAuth('login'));
  } else if(view==='reset'){
    el('btn-reset', async()=>{
      const pass=document.getElementById('a-pass').value;
      const pass2=document.getElementById('a-pass2').value;
      if(pass.length<8){ authMsg('Password must be at least 8 characters'); return; }
      if(pass!==pass2){ authMsg('Passwords do not match'); return; }
      const {error}=await sb.auth.updateUser({password:pass});
      if(error) authMsg(error.message);
      else { authMsg('Password updated!','success'); setTimeout(()=>showApp(),1500); }
    });
  }
}

// Redeem an invite code → creates the account via the redeem-invite Edge Function.
async function redeemInvite(code, email, password){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/redeem-invite`,{
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ code, email, password })
  });
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok || data.error) throw new Error(data.error || 'Could not create your account.');
  return data;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDateShort(d){ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function lbsToKg(v){ return (v*0.453592).toFixed(1); }
function kgToLbs(v){ return (v*2.20462).toFixed(1); }

// ── Lift weight units (lifting-only; the bodyweight tracker uses state.weightUnit) ──
const LB_INCS=[1,5,10,25,45,100], KG_INCS=[1,2.5,5,10,20,25];
function liftUnitLabel(){ return state.liftUnit==='kg'?'kg':'lbs'; }
function liftIncrements(){ return state.liftUnit==='kg'?KG_INCS:LB_INCS; }
function liftToLbs(v){ return state.liftUnit==='kg' ? +( +v*2.20462 ).toFixed(2) : +v; }        // display unit → canonical lbs (stored)
function lbsToLift(lbs){ const n=+lbs; return state.liftUnit==='kg' ? +(n*0.453592).toFixed(1) : (Number.isInteger(n)?n:+n.toFixed(1)); } // lbs → display number
function fmtLift(lbs){ return `${lbsToLift(lbs)} ${liftUnitLabel()}`; }                            // "100 lbs" / "45 kg"

// ── Assisted exercises (lower weight = a better lift) ──
function isAssisted(name){ const s=state.exerciseSettings[name]; return !!(s&&s.assisted); }
// Best working set, honoring assisted (reverse) ordering. Higher reps breaks ties.
function bestSet(sets, assisted){
  return sets.reduce((a,b)=> assisted
    ? ((b.weight<a.weight||(b.weight===a.weight&&b.reps>a.reps))?b:a)
    : ((b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps))?b:a) );
}
// Is candidate a better PR than current, for this ordering?
function betterPR(cand, cur, assisted){
  if(!cur) return true;
  return assisted
    ? (cand.weight<cur.weight||(cand.weight===cur.weight&&cand.reps>cur.reps))
    : (cand.weight>cur.weight||(cand.weight===cur.weight&&cand.reps>cur.reps));
}
// Recompute an exercise's PR from all logged working sets (used when its assisted flag flips).
function recomputePR(name){
  const assisted=isAssisted(name); let best=null;
  state.sessions.forEach(s=>s.exercises.forEach(ex=>{
    if(ex.type==='cardio'||ex.name!==name) return;
    const working=(ex.sets||[]).filter(x=>x.type==='working');
    if(!working.length) return;
    const b=bestSet(working,assisted);
    if(betterPR(b,best,assisted)) best={weight:b.weight,reps:b.reps,date:s.date};
  }));
  if(best){ state.prs[name]=best; dbSavePR(name,best); }
}
function setAssisted(name, assisted){
  state.exerciseSettings[name]={assisted:!!assisted};
  dbSetExerciseSetting(name, !!assisted);
  recomputePR(name);
}
function displayWeight(entry){
  if(entry.unit===state.weightUnit) return `${entry.value} ${entry.unit}`;
  return state.weightUnit==='kg'?`${lbsToKg(entry.value)} kg`:`${kgToLbs(entry.value)} lbs`;
}
function isMealFav(entry){ return state.mealFavorites.some(f=>f.name===entry.name&&f.calories===entry.calories&&f.protein===entry.protein); }
function toast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=color||'var(--green)'; t.style.color=color?'#fff':'#0a1f16';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function safeRender(fn, name){
  try { return fn(); }
  catch(e){
    console.error(`render error in ${name}:`, e.message, e.stack);
    return `<div style="padding:20px;color:var(--red);font-size:13px;font-weight:700">⚠ Error in ${name}: ${e.message}</div>`;
  }
}

const _scrollByView={}; let _prevScreenKey=null;
// Identity of the current screen, including sub-screens, so scroll is only
// restored across in-place re-renders — not when you actually navigate.
function screenKey(){
  switch(state.view){
    case 'log':        return `log:${state.logStep}:${state.selectedMuscle||''}:${state.selectedExercise||''}`;
    case 'nutrition':  return `nutrition:${state.nutritionView}`;
    case 'bodyweight': return `bodyweight:${state.weightView}`;
    case 'history':    return `history:${state.historyTab}`;
    default:           return state.view;
  }
}
function render(){
  // Remember the active view's scroll so re-rendering (logging a set, toggling a
  // favorite, sorting, etc.) doesn't fling the page back to the top.
  const prev=document.querySelector('#views-wrap .view.active');
  if(prev&&_prevScreenKey!=null) _scrollByView[_prevScreenKey]=prev.scrollTop;
  document.getElementById('nav-wrap').innerHTML=renderNav();
  document.getElementById('views-wrap').innerHTML=`
    <div class="view ${state.view==='log'?'active':''}">${safeRender(renderLog,'Workout')}</div>
    <div class="view ${state.view==='nutrition'?'active':''}">${safeRender(renderNutrition,'Nutrition')}</div>
    <div class="view ${state.view==='bodyweight'?'active':''}">${safeRender(renderBodyweight,'Weight')}</div>
    <div class="view ${state.view==='history'?'active':''}">${safeRender(renderHistory,'History')}</div>
    <div class="view ${state.view==='more'?'active':''}">${safeRender(renderMore,'More')}</div>
    <div class="view ${state.view==='admin'?'active':''}">${state.view==='admin'?safeRender(renderAdmin,'Admin'):''}</div>
    <div class="view ${state.view==='support'?'active':''}">${state.view==='support'?safeRender(renderSupport,'Support'):''}</div>`;
  attachEvents();
  const key=screenKey();
  const now=document.querySelector('#views-wrap .view.active');
  if(now&&(key in _scrollByView)) now.scrollTop=_scrollByView[key];
  _prevScreenKey=key;
}

function workingIdx(i){ let n=0; for(let j=0;j<=i;j++){ if(state.pendingSets[j].type==='working') n++; } return n; }

function renderExerciseHistory(exercise){
  const past=[];
  state.sessions.forEach(s=>{ s.exercises.forEach(ex=>{ if(ex.type==='cardio') return; if(ex.name===exercise){ const working=ex.sets.filter(s=>s.type==='working'); if(working.length) past.push({date:s.date,sets:working}); } }); });
  if(!past.length) return '';
  past.sort((a,b)=>b.date-a.date);
  const shown=past.slice(0,8);
  const assisted=isAssisted(exercise);
  let overallBest=null; past.forEach(session=>{ const s=bestSet(session.sets,assisted); if(betterPR(s,overallBest,assisted)) overallBest=s; });
  return `<div style="margin-top:8px;border-top:2px dashed var(--border);padding-top:16px"><div class="card-title" style="margin-bottom:12px">Past Sessions — ${exercise}${assisted?' <span style="color:var(--accent)">· assisted</span>':''}</div><div class="section-gap">${shown.map((session,idx)=>{ const best=bestSet(session.sets,assisted); const isPR=best.weight===overallBest.weight&&best.reps===overallBest.reps; return `<div style="background:var(--surface);border:1px solid ${idx===0?'var(--accent)':'var(--border)'};border-radius:var(--radius-sm);padding:10px 14px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><div style="font-size:12px;font-weight:700;color:${idx===0?'var(--accent)':'var(--text-muted)'}">${idx===0?'Most Recent — ':''}${fmtDate(session.date)}</div>${isPR?`<div style="font-size:10px;font-weight:800;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);border-radius:20px;padding:2px 7px">🏆 PR</div>`:''}</div><div style="font-size:13px;color:var(--text-muted);line-height:1.8">${session.sets.map(s=>`<span style="color:var(--text);font-weight:700">${fmtLift(s.weight)}</span> × ${s.reps}`).join(' &nbsp;·&nbsp; ')}</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Best: ${fmtLift(best.weight)} × ${best.reps} &nbsp;·&nbsp; ${session.sets.length} set${session.sets.length!==1?'s':''}</div></div>`; }).join('')}</div></div>`;
}

// ── CARDIO STOPWATCH ──────────────────────────────────────────────────────────
function swStart(){ if(state.cardio.stopwatch.running) return; state.cardio.stopwatch.running=true; state.cardio.stopwatch.interval=setInterval(()=>{ state.cardio.stopwatch.elapsed++; updateSwDOM(); },1000); updateSwDOM(); }
function swStop(){ if(state.cardio?.stopwatch?.interval){ clearInterval(state.cardio.stopwatch.interval); state.cardio.stopwatch.interval=null; } if(state.cardio?.stopwatch) state.cardio.stopwatch.running=false; updateSwDOM(); }
function swReset(){ swStop(); state.cardio.stopwatch.elapsed=0; updateSwDOM(); }
function updateSwDOM(){
  const disp=document.getElementById('sw-display'); if(!disp) return;
  const e=state.cardio.stopwatch.elapsed; const m=Math.floor(e/60); const s=e%60;
  disp.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  disp.style.color=state.cardio.stopwatch.running?'var(--accent)':'var(--text)';
  const btn=document.getElementById('sw-toggle');
  if(btn){ btn.textContent=state.cardio.stopwatch.running?'⏸ Pause':'▶ Start'; btn.className=`btn ${state.cardio.stopwatch.running?'btn-danger':'btn-green'}`; }
}

// ── HR GUIDED TEST ────────────────────────────────────────────────────────────
function hrStartCountdown(){
  state.cardio.hrTestCountdown=3; state.cardio.hrTestStep='countdown'; render();
  state.cardio.hrTestInterval=setInterval(()=>{
    state.cardio.hrTestCountdown--;
    if(state.cardio.hrTestCountdown<=0){
      clearInterval(state.cardio.hrTestInterval); state.cardio.hrTestInterval=null;
      state.cardio.hrTestCountdown=10; state.cardio.hrTestStep='counting'; render();
      state.cardio.hrTestInterval=setInterval(()=>{
        state.cardio.hrTestCountdown--;
        if(state.cardio.hrTestCountdown<=0){ clearInterval(state.cardio.hrTestInterval); state.cardio.hrTestInterval=null; state.cardio.hrTestStep='input'; render(); }
        else { const el=document.querySelector('.hr-circle-progress'); if(el) el.setAttribute('stroke-dashoffset',(282.7*(1-state.cardio.hrTestCountdown/10)).toFixed(1)); }
      },1000);
    } else { const el=document.querySelector('.hr-countdown-display'); if(el) el.textContent=state.cardio.hrTestCountdown; }
  },1000);
}
function hrCancelTest(){ if(state.cardio.hrTestInterval){ clearInterval(state.cardio.hrTestInterval); state.cardio.hrTestInterval=null; } state.cardio.hrTestStep='idle'; state.cardio.hrTestCountdown=0; render(); }

function logCardioActivity(){
  const distInput=document.getElementById('cardio-distance');
  const dist=distInput?parseFloat(distInput.value)||null:null;
  const entry={type:'cardio',name:state.cardio.activity,duration:state.cardio.stopwatch.elapsed,distance:dist,distUnit:state.cardio.distUnit,heartRate:state.cardio.heartRate};
  if(!state._currentSession) state._currentSession={id:uid(),date:Date.now(),exercises:[]};
  state._currentSession.exercises.push(entry);
  swStop();
  state.cardio={activity:null,stopwatch:{running:false,elapsed:0,interval:null},distance:'',distUnit:'mi',heartRate:null,hrTestStep:'idle',hrTestCountdown:0,hrTestInterval:null,hrBeats:''};
  state.logStep='workout'; toast(`${entry.name} logged! 🏃`); render();
}

function fmtDuration(secs){ const m=Math.floor(secs/60); const s=secs%60; return s>0?`${m}m ${s}s`:`${m}m`; }

const PERIODS=['7d','14d','1m','3m','6m','1y','2y'];
function periodMs(p){ const d={'7d':7,'14d':14,'1m':30,'3m':90,'6m':180,'1y':365,'2y':730}; return (d[p]||30)*86400000; }

function renderWeightChartSVG(period,unit){
  const cutoff=Date.now()-periodMs(period);
  const filtered=[...state.weightLog].filter(e=>e.date>=cutoff).sort((a,b)=>a.date-b.date);
  if(filtered.length<2) return `<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Need at least 2 entries in this period to show a chart</div>`;
  const points=filtered.map(e=>({
    date:e.date,
    weight: unit==='kg'
      ?(e.unit==='kg'?parseFloat(e.value):parseFloat(lbsToKg(e.value)))
      :(e.unit==='lbs'?parseFloat(e.value):parseFloat(kgToLbs(e.value)))
  }));
  return renderProgressChart(points);
}

function renderCalorieBarChart(period){
  const cutoff=Date.now()-periodMs(period);
  const byDate={};
  state.foodLog.forEach(e=>{
    const ms=new Date(e.date).getTime();
    if(ms>=cutoff) byDate[e.date]=(byDate[e.date]||0)+(e.calories||0);
  });
  const entries=Object.entries(byDate).map(([date,cal])=>({date:new Date(date).getTime(),cal})).sort((a,b)=>a.date-b.date);
  if(!entries.length) return `<div class="empty">No nutrition data for this period</div>`;
  const goal=state.macroGoals.calories;
  const W=360,H=180,PAD={top:16,right:28,bottom:28,left:44};
  const cW=W-PAD.left-PAD.right,cH=H-PAD.top-PAD.bottom;
  const maxCal=Math.max(...entries.map(e=>e.cal),goal)*1.1;
  const n=entries.length;
  const barW=Math.min(22,Math.max(4,(cW/n)*0.65));
  const toX=i=>PAD.left+(n===1?cW/2:(i/(n-1))*cW);
  const toY=c=>PAD.top+cH-(c/maxCal)*cH;
  const goalY=toY(goal);
  const yVals=[0,Math.round(maxCal/2),Math.round(maxCal)];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    ${yVals.map(c=>{const y=toY(c);return `<line x1="${PAD.left}" y1="${y.toFixed(1)}" x2="${W-PAD.right}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${PAD.left-6}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="system-ui">${c}</text>`;}).join('')}
    <line x1="${PAD.left}" y1="${goalY.toFixed(1)}" x2="${W-PAD.right}" y2="${goalY.toFixed(1)}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="${(W-PAD.right+2)}" y="${(goalY-3).toFixed(1)}" fill="var(--amber)" font-size="9" font-family="system-ui">goal</text>
    ${entries.map((e,i)=>{const x=toX(i),y=toY(e.cal),h=Math.max(2,cH-(y-PAD.top));const color=e.cal>goal?'var(--amber)':'var(--accent)';return `<rect x="${(x-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" rx="2"/>`;}).join('')}
    <text x="${toX(0).toFixed(1)}" y="${H-4}" text-anchor="start" fill="var(--text-muted)" font-size="9" font-family="system-ui">${fmtDateShort(entries[0].date)}</text>
    ${n>1?`<text x="${toX(n-1).toFixed(1)}" y="${H-4}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="system-ui">${fmtDateShort(entries[n-1].date)}</text>`:''}
  </svg>`;
}

function startOfWeekMonday(ts){ const d=new Date(ts); d.setHours(0,0,0,0); const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return d.getTime(); }
// Working sets per muscle for the current week (Mon start).
function weeklySetCounts(strengthOnly){
  const start=startOfWeekMonday(Date.now()); const c={};
  state.sessions.forEach(s=>{ if(s.date<start) return; (s.exercises||[]).forEach(ex=>{ if(ex.type==='cardio'||!ex.sets) return; const m=ex.muscle; if(!m) return; ex.sets.forEach(set=>{ if(set.type!=='working') return; if(strengthOnly && (parseInt(set.reps)||0)>6) return; c[m]=(c[m]||0)+1; }); }); });
  return c;
}
function setGoal(g){ state.goal=g; try{ localStorage.setItem('li_goal',g); }catch(e){} render(); }
function setStrengthRedMode(m){ state.strengthRedMode=m; try{ localStorage.setItem('li_str_red',m); }catch(e){} render(); }
function goalTargets(){ return (state.planTargets&&state.planTargets[state.goal])||{}; }
function goalUpper(){ return state.goal==='strength'?12:20; }
let _planSaveTimer=null;
function schedulePlanSave(){ clearTimeout(_planSaveTimer); _planSaveTimer=setTimeout(dbSavePlan,600); }
async function dbSavePlan(){ const {error}=await sb.from('plan_targets').upsert({user_id:currentUser.id,targets:state.planTargets,updated_at:new Date().toISOString()},{onConflict:'user_id'}); if(error) toast('Could not save plan','var(--red)'); }
function volumeColor(n, goal){ goal=goal||state.goal; if(goal==='strength') return n>12?'var(--red)':n>=10?'#f97316':n>=6?'#eab308':'var(--accent)'; return n>20?'var(--red)':n>=18?'#f97316':n>=12?'#eab308':'var(--accent)'; }
// Segmented progress bar — the filled portion is colored by which volume band
// each slice of sets falls into (blue 0–12, gold 12–18, orange 18–20, red 20+,
// scaled down for strength), so one bar shows the whole journey through the
// thresholds. The unfilled track runs toward the target (ref).
function volumeSegBar(did, ref, goal){
  goal=goal||state.goal;
  // Strength red caution: "fixed" warns past an absolute ~12 heavy sets/week
  // (a recovery guardrail, same for everyone); "relative" warns once you go
  // past your own target (scales the caution to your plan).
  const redAt = state.strengthRedMode==='relative' ? Math.max(1,ref) : 12;
  const bands=goal==='strength'
    ? [[0,redAt,'var(--accent)'],[redAt,1e9,'var(--red)']]
    : [[0,12,'var(--accent)'],[12,18,'#eab308'],[18,20,'#f97316'],[20,1e9,'var(--red)']];
  const scale=Math.max(ref,did,1);
  const segs=bands.map(([lo,hi,c])=>{ const a=Math.max(lo,0), b=Math.min(hi,did); return b>a?`<div style="height:100%;width:${(b-a)/scale*100}%;background:${c}"></div>`:''; }).join('');
  return `<div class="macro-bar-wrap" style="display:flex">${segs}</div>`;
}
// Mini progress bar for a workout button. muscles = [m] for one muscle, or a group's muscle list. Hidden when goal is 'off'.
function volBar(counts, muscles){
  if(state.goal==='off') return '';
  const tgts=goalTargets(); let sets=0, tgt=0;
  muscles.forEach(m=>{ sets+=counts[m]||0; tgt+=parseInt(tgts[m])||0; });
  const ref=tgt>0?tgt:muscles.length*goalUpper();
  const pct=ref>0?Math.min(100,Math.round(sets/ref*100)):0;
  const color=volumeColor(sets/Math.max(1,muscles.length));
  return `<div class="mbtn-bar"><div style="height:100%;width:${pct}%;background:${color}"></div></div>`;
}

  const redModeBox=strength?`
    <div class="card" style="margin-bottom:8px">
      <div style="font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:8px"><b style="color:var(--text)">When does red appear?</b> Heavy sets are recovery-costly, so the bar flags when you've done too many — but "too many" can be judged two ways:<br>
        • <b style="color:var(--text)">Fixed</b> — an absolute ~12 heavy sets per muscle per week, the same recovery guardrail for everyone.<br>
        • <b style="color:var(--text)">Relative</b> — tied to your own target, so red appears as soon as you go past your plan.</div>
      <div class="toggle-group">
        <div class="toggle-opt ${state.strengthRedMode==='fixed'?'active':''}" data-strred="fixed" style="font-size:13px">Fixed (12+)</div>
        <div class="toggle-opt ${state.strengthRedMode==='relative'?'active':''}" data-strred="relative" style="font-size:13px">Relative</div>

function renderVolumeTab(){
  const period=state.volumePeriod, now=Date.now();
  const opts=[['week','This week'],['7d','7 days'],['14d','14 days'],['1m','1 month']];
  const start=period==='week'?startOfWeekMonday(now):period==='7d'?now-7*864e5:period==='14d'?now-14*864e5:now-30*864e5;
  const map={};
  state.sessions.forEach(s=>{ if(s.date<start) return; (s.exercises||[]).forEach(ex=>{ if(ex.type==='cardio'||!ex.sets) return; const m=ex.muscle||'Other'; ex.sets.forEach(set=>{ if(set.type!=='working') return; if(!map[m]) map[m]={volume:0,sets:0}; map[m].volume+=(parseFloat(set.weight)||0)*(parseInt(set.reps)||0); map[m].sets+=1; }); }); });
  const rows=Object.entries(map).sort((a,b)=>b[1].volume-a[1].volume);
  const maxVol=rows.length?rows[0][1].volume:0;
  const totalVol=rows.reduce((a,r)=>a+r[1].volume,0), totalSets=rows.reduce((a,r)=>a+r[1].sets,0);
  return `
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-shrink:0">
      ${opts.map(([v,l])=>`<button class="period-btn ${period===v?'active':''}" onclick="state.volumePeriod='${v}';render()">${l}</button>`).join('')}
    </div>
    ${rows.length===0?'<div class="empty">No working sets logged in this period.</div>':`
      <div style="font-size:12px;color:var(--text-muted);text-align:center;margin:2px 0 6px">${Math.round(state.liftUnit==='kg'?totalVol*0.453592:totalVol).toLocaleString()} ${liftUnitLabel()} total volume · ${totalSets} working set${totalSets!==1?'s':''}</div>
      <div class="card"><div class="section-gap">${rows.map(([m,d])=>{ const pct=maxVol>0?Math.round(d.volume/maxVol*100):0; return `<div><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px"><span style="font-size:14px;font-weight:700;color:var(--text)">${esc(m)}</span><span style="font-size:13px;color:var(--text-muted)"><b style="color:var(--text)">${Math.round(state.liftUnit==='kg'?d.volume*0.453592:d.volume).toLocaleString()}</b> ${liftUnitLabel()} · ${d.sets} set${d.sets!==1?'s':''}</span></div><div class="macro-bar-wrap"><div class="macro-bar" style="width:${pct}%;background:var(--accent)"></div></div></div>`; }).join('')}</div></div>
    `}`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function attachEvents(){
  const el=(id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click',fn); };
  const on=(id,ev,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); };

  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.nav; render(); }));

  // Group → direct to exercise (single muscle) or muscle select (multi)
  document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{
    const g=b.dataset.group;
    state.selectedGroup=g;
    const muscles=GROUPS[g]||[];
    if(muscles.length===1){ state.selectedMuscle=muscles[0]; state.logStep='exercise'; }
    else state.logStep='muscle';
    state.searchQ=''; render();
  }));

  document.querySelectorAll('[data-muscle]').forEach(b=>b.addEventListener('click',()=>{ state.selectedMuscle=b.dataset.muscle; state.searchQ=''; state.logStep='exercise'; render(); }));
  document.querySelectorAll('[data-exercise]').forEach(b=>b.addEventListener('click',e=>{ if(e.target.closest('[data-fav]')) return; state.selectedExercise=b.dataset.exercise; state.pendingSets=[]; state.logStep='sets'; render(); }));

  document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',async e=>{ e.stopPropagation(); const ex=b.dataset.fav; const idx=state.favorites.indexOf(ex); if(idx>=0) state.favorites.splice(idx,1); else state.favorites.push(ex); render(); dbToggleExFav(ex); }));

  el('back-workout',()=>{ state.logStep='workout'; state.searchQ=''; render(); });
  el('back-muscle', ()=>{ state.logStep='muscle';  state.searchQ=''; render(); });
  el('back-exercise',()=>{ state.logStep='exercise'; render(); });
  on('ex-search','input',e=>{ state.searchQ=e.target.value; render(); });
  el('fav-filter',()=>{ state.favFilter=!state.favFilter; render(); });

  document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{ state.setType=b.dataset.toggle; render(); }));
  document.querySelectorAll('[data-wunit]').forEach(b=>b.addEventListener('click',()=>{ state.weightUnit=b.dataset.wunit; localStorage.setItem('li_weight_unit',state.weightUnit); render(); }));

function commitExercise(){
  if(!state.pendingSets.length) return;
  if(!state._currentSession) state._currentSession={id:uid(),date:Date.now(),exercises:[]};
  const working=state.pendingSets.filter(s=>s.type==='working');
  if(working.length){
    const assisted=isAssisted(state.selectedExercise);
    const best=bestSet(working,assisted);
    const pr=state.prs[state.selectedExercise];
    if(betterPR(best,pr,assisted)){
      state.prs[state.selectedExercise]={weight:best.weight,reps:best.reps,date:Date.now()};
      dbSavePR(state.selectedExercise,state.prs[state.selectedExercise]);
      toast('🏆 New PR!','var(--amber)');
    }
  }
  state._currentSession.exercises.push({muscle:state.selectedMuscle,name:state.selectedExercise,sets:[...state.pendingSets]});
  state.pendingSets=[];
}

function resumeSession(sessionId){
  const s=state.sessions.find(s=>s.id===sessionId); if(!s) return;
  if(state._currentSession){ toast('Finish your current workout first','var(--red)'); return; }
  state._currentSession={id:s.id,date:s.date,exercises:JSON.parse(JSON.stringify(s.exercises))};
  state.sessions=state.sessions.filter(x=>x.id!==s.id);
  dbDeleteSession(s.id);
  const last=s.exercises[s.exercises.length-1];
  if(last?.type==='cardio'){
    state.logStep='workout';
  } else {
    state.selectedMuscle=last?.muscle||null; state.selectedExercise=null; state.pendingSets=[];
    state.logStep='exercise';
  }
  state.view='log';
  toast('Workout resumed — add more or finish'); render();
}

function exportAllCSV(){
  const date=new Date().toISOString().slice(0,10);
  const rows=[]; const blank=['','','','','','',''];
  rows.push(['WORKOUTS','','','','','','']);
  rows.push(['Date','Muscle Group','Exercise','Set Type','Set #','Weight (lbs)','Reps']);
  state.sessions.forEach(s=>{ const d=new Date(s.date).toLocaleDateString('en-US'); s.exercises.forEach(ex=>{ let wu=0,wk=0; ex.sets.forEach(set=>{ if(set.type==='warmup') wu++; else wk++; rows.push([d,ex.muscle,ex.name,set.type,set.type==='warmup'?wu:wk,set.weight,set.reps]); }); }); });
  rows.push(blank);
  rows.push(['PERSONAL RECORDS','','','','','','']);
  rows.push(['Exercise','Weight (lbs)','Reps','Date','','','']);
  Object.entries(state.prs).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([ex,pr])=>rows.push([ex,pr.weight,pr.reps,fmtDate(pr.date),'','','']));
  rows.push(blank);
  rows.push(['BODY WEIGHT','','','','','','']);
  rows.push(['Date','Weight (lbs)','Weight (kg)','','','','']);
  [...state.weightLog].sort((a,b)=>a.date-b.date).forEach(e=>{ const lbs=e.unit==='lbs'?e.value:kgToLbs(e.value); const kg=e.unit==='kg'?e.value:lbsToKg(e.value); rows.push([fmtDate(e.date),lbs,kg,'','','','']); });
  rows.push(blank);
  rows.push(['NUTRITION','','','','','','']);
  rows.push(['Date','Time','Food / Meal','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)']);
  [...state.foodLog].sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push([e.date,fmtTime(e.ts),e.name,e.calories,e.protein,e.carbs,e.fat]));
  rows.push(blank);
  rows.push(['MACRO GOALS','','','','','','']);
  rows.push(['Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','','','']);
  rows.push([state.macroGoals.calories,state.macroGoals.protein,state.macroGoals.carbs,state.macroGoals.fat,'','','']);
  if(state.mealFavorites.length){ rows.push(blank); rows.push(['MEAL FAVORITES','','','','','','']); rows.push(['Name','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)','','']); state.mealFavorites.forEach(f=>rows.push([f.name,f.calories,f.protein,f.carbs,f.fat,'',''])); }
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`lockin-export-${date}.csv`; a.click();
  toast('Exported! 📥');
}

function showAddFoodModal(){
  let aiNotes=[];
  let aiUsed=false;  // set once AI Macros produced an estimate for this entry
  const UNITS=['units','oz','g','lb','cup','tbsp','tsp','ml','slice'];
  document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" id="modal-overlay"><div class="modal" style="max-height:88vh;overflow-y:auto">
    <div class="modal-title">Add Food / Meal</div>
    <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="e.g. Chicken breast…"></div>

      <div class="field" style="margin:0"><label>Qty</label><input type="number" id="f-qty" value="1" min="0" step="0.5" inputmode="decimal"></div>
      <div class="field" style="margin:0"><label>Unit</label><select id="f-unit" class="select">${UNITS.map(u=>`<option value="${u}">${u==='units'?'servings':u}</option>`).join('')}</select></div>
      <button class="btn btn-outline" id="ai-macros-btn" title="Estimates macros with Claude (AI) from the food name and amount. These are approximations and can be wrong — double-check the numbers before relying on them." style="white-space:nowrap">✨ AI Macros</button>
    </div>
    <div id="ai-status" style="margin:6px 0 0"></div>
    <div class="field" style="margin-top:10px"><label>Calories (kcal)</label><input type="number" id="f-cal" placeholder="0"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div class="field"><label>Protein (g)</label><input type="number" id="f-pro" placeholder="0"></div><div class="field"><label>Carbs (g)</label><input type="number" id="f-carb" placeholder="0"></div><div class="field"><label>Fat (g)</label><input type="number" id="f-fat" placeholder="0"></div></div>
    <div class="btn-grid"><button class="btn btn-outline" id="modal-cancel">Cancel</button><button class="btn btn-primary" id="modal-save-food">Add</button></div>
  </div></div>`;
  const $=id=>document.getElementById(id);
  $('modal-cancel').addEventListener('click',closeModal);
  $('modal-overlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
  $('f-name').focus();

  const note=(html)=>{ $('ai-status').innerHTML=html; };
  async function runAI(){
    const name=$('f-name').value.trim(); if(!name){ toast('Enter a food name first','var(--red)'); return; }
    const qty=parseFloat($('f-qty').value)||1; const unit=$('f-unit').value;
    const btn=$('ai-macros-btn'); btn.disabled=true;
    note(`<div style="font-size:12px;color:var(--text-muted)">✨ Estimating…</div>`);
    try{
      const r=await aiMacros({food:name,qty,unit,clarification:aiNotes.join('; ')});
      if(r.type==='clarify'){
        note(`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px"><div style="font-size:13px;color:var(--text);font-weight:600;margin-bottom:8px">${esc(r.question)}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${(r.options||[]).map((o,i)=>`<button class="btn btn-outline btn-xs" data-aiopt="${i}">${esc(o)}</button>`).join('')}</div></div>`);
        $('ai-status').querySelectorAll('[data-aiopt]').forEach(b=>b.addEventListener('click',()=>{ aiNotes.push(`${r.question} → ${r.options[+b.dataset.aiopt]}`); runAI(); }));
      } else if(r.type==='macros'){
        aiUsed=true;
        $('f-cal').value=r.calories; $('f-pro').value=r.protein; $('f-carb').value=r.carbs; $('f-fat').value=r.fat;
        const detail=[r.basis,r.assumptions].filter(Boolean).map(esc).join(' · ');
        const label=r.source==='cache'?'From saved data':'AI estimate';
        note(`<div style="font-size:12px;color:var(--amber)">✨ ${label} — verify before relying on it.${detail?`<div style="color:var(--text-muted);margin-top:2px">${detail}</div>`:''}</div>`);
      } else { note(`<div style="font-size:12px;color:var(--text-muted)">Couldn't estimate — enter manually.</div>`); }
    }catch(err){ note(`<div style="font-size:12px;color:var(--text-muted)">AI unavailable — enter macros manually.</div>`); }
    btn.disabled=false;
  }
  $('ai-macros-btn').addEventListener('click',()=>{ aiNotes=[]; runAI(); });

  $('modal-save-food').addEventListener('click',()=>{
    const name=$('f-name').value.trim(); if(!name){ toast('Enter a food name','var(--red)'); return; }
    const entry={id:uid(),date:todayKey(),ts:Date.now(),name,calories:parseInt($('f-cal').value)||0,protein:parseFloat($('f-pro').value)||0,carbs:parseFloat($('f-carb').value)||0,fat:parseFloat($('f-fat').value)||0};

    if(aiUsed && entry.calories>0){
      const qty=parseFloat($('f-qty').value)||1, unit=$('f-unit').value;
      aiMacrosRecord({food:name,qty,unit,clarification:aiNotes.join('; '),calories:entry.calories,protein:entry.protein,carbs:entry.carbs,fat:entry.fat});
    }
    state.foodLog.push(entry); closeModal(); render(); dbAddFood(entry);
  });
}

function renderProgressChart(points){
  if(points.length<2) return `<div style="text-align:center;color:var(--text-muted);padding:16px;font-size:13px">Log more sessions to see your progression chart</div>`;
  const W=360,H=160;
  const PAD={top:12,right:16,bottom:28,left:44};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const weights=points.map(p=>p.weight);
  const minW=Math.min(...weights), maxW=Math.max(...weights);
  const wRange=maxW-minW||10;
  const dates=points.map(p=>p.date);
  const minD=Math.min(...dates), maxD=Math.max(...dates);
  const dRange=maxD-minD||1;
  const toX=d=>PAD.left+((d-minD)/dRange)*cW;
  const toY=w=>PAD.top+cH-((w-minW)/wRange)*cH;
  const pts=points.map(p=>({x:toX(p.date),y:toY(p.weight),w:p.weight,d:p.date}));
  const pathD=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const yLabels=[minW,minW+wRange/2,maxW].map(w=>({y:toY(w),label:Math.round(w)}));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    ${yLabels.map(l=>`<line x1="${PAD.left}" y1="${l.y.toFixed(1)}" x2="${W-PAD.right}" y2="${l.y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join('')}
    ${yLabels.map(l=>`<text x="${PAD.left-6}" y="${(l.y+4).toFixed(1)}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="system-ui">${l.label}</text>`).join('')}
    <text x="${toX(minD).toFixed(1)}" y="${H-4}" text-anchor="start" fill="var(--text-muted)" font-size="10" font-family="system-ui">${fmtDateShort(minD)}</text>
    <text x="${toX(maxD).toFixed(1)}" y="${H-4}" text-anchor="end" fill="var(--text-muted)" font-size="10" font-family="system-ui">${fmtDateShort(maxD)}</text>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`).join('')}
  </svg>`;
}

// Manage which exercises are "assisted" (lower weight = better PR). Reached from More.
function allExerciseNames(){
  const set=new Set();
  if(typeof EXERCISES==='object'&&EXERCISES) Object.values(EXERCISES).forEach(arr=>(arr||[]).forEach(n=>set.add(n)));
  state.customExercises.forEach(e=>set.add(e.name));
  return [...set].sort((a,b)=>a.localeCompare(b));
}

            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <div style="min-width:0">
                <div style="font-family:monospace;font-size:13px;font-weight:700;color:${used?'var(--text-muted)':'var(--text)'}">${c.code}</div>
                <div style="font-size:11px;color:var(--text-muted)">${c.label?c.label+' · ':''}${c.used_count}/${c.max_uses} used${used?' · spent':''}</div>
              </div>
              <div style="display:flex;gap:6px;flex-shrink:0">
                <button class="btn btn-outline btn-xs" data-qr="${c.code}">QR</button>
                <button class="btn btn-outline btn-xs" data-copy="${c.code}">Copy</button>
              </div>
            </div>`; }).join('<hr class="divider" style="margin:2px 0">')}</div>`:''}
        <button class="btn btn-outline btn-full" id="modal-cancel" style="margin-top:8px">Close</button>
      </div>
    </div>`;
  document.getElementById('modal-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-overlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });
  document.getElementById('inv-generate').addEventListener('click',async()=>{
    const label=document.getElementById('inv-label').value.trim();
    const uses=Math.max(1,parseInt(document.getElementById('inv-uses').value)||1);
    const btn=document.getElementById('inv-generate'); btn.disabled=true; btn.textContent='Generating…';
    const code=await dbCreateInviteCode(label,uses);
    if(code) showInvitesModal(code); else { btn.disabled=false; btn.textContent='Generate Invite'; }
  });
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>navigator.clipboard.writeText(inviteLink(b.dataset.copy)).then(()=>toast('Link copied!'),()=>toast('Copy failed','var(--red)'))));
  document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',()=>shareInvite(b.dataset.share)));
  document.querySelectorAll('[data-qr]').forEach(b=>b.addEventListener('click',()=>showInvitesModal(b.dataset.qr)));
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// ─── REST TIMER ───────────────────────────────────────────────────────────────
const PRESETS=[30,60,90,120];
function renderTimer(){
  const t=state.timer;
  const pct=t.total>0?(t.remaining/t.total)*100:0;
  const mins=Math.floor(t.remaining/60); const secs=t.remaining%60;
  const display=t.remaining>0?(mins>0?`${mins}:${String(secs).padStart(2,'0')}`:`${secs}s`):(t.total>0?'Rest up!':'Rest Timer');
  const stateClass=t.running?'running':(t.total>0&&t.remaining===0?'done':'');
  return `<div class="timer-card ${stateClass}"><div class="card-title">Rest Timer</div><div class="timer-display ${stateClass}">${display}</div><div class="timer-presets">${PRESETS.map(p=>`<div class="timer-preset ${t.running&&state._lastPreset===p?'active':''}" data-preset="${p}">${p>=60?(p/60)+'m':p+'s'}</div>`).join('')}</div>${t.running?`<div class="timer-progress"><div class="timer-progress-bar" style="width:${pct}%"></div></div><button class="timer-cancel" id="timer-cancel">✕ cancel</button>`:''}</div>`;
}
function timerStart(seconds){ timerStop(); state.timer.remaining=seconds; state.timer.total=seconds; state.timer.running=true; state._lastPreset=seconds; state.timer.interval=setInterval(()=>{ state.timer.remaining=Math.max(0,state.timer.remaining-1); if(state.timer.remaining===0){ timerStop(true); chime(); } updateTimerDOM(); },1000); updateTimerDOM(); }
function timerAdd(seconds){ if(!state.timer.running){ timerStart(seconds); return; } state.timer.remaining+=seconds; state.timer.total+=seconds; state._lastPreset=seconds; updateTimerDOM(); }
function timerStop(expired){ if(state.timer.interval){ clearInterval(state.timer.interval); state.timer.interval=null; } state.timer.running=false; if(!expired){ state.timer.remaining=0; state.timer.total=0; } }
function updateTimerDOM(){
  const t=state.timer; const card=document.querySelector('.timer-card'); if(!card) return;
  const pct=t.total>0?(t.remaining/t.total)*100:0;
  const mins=Math.floor(t.remaining/60); const secs=t.remaining%60;
  const display=t.remaining>0?(mins>0?`${mins}:${String(secs).padStart(2,'0')}`:`${secs}s`):'Rest up!';
  const stateClass=t.running?'running':(t.remaining===0&&t.total>0?'done':'');
  const disp=card.querySelector('.timer-display'); if(disp){ disp.textContent=display; disp.className=`timer-display ${stateClass}`; } card.className=`timer-card ${stateClass}`;
  const bar=card.querySelector('.timer-progress-bar'); if(bar) bar.style.width=pct+'%';
  const cancelBtn=card.querySelector('#timer-cancel');
  if(t.running&&!cancelBtn){ const presetsEl=card.querySelector('.timer-presets'); const progDiv=document.createElement('div'); progDiv.className='timer-progress'; progDiv.innerHTML=`<div class="timer-progress-bar" style="width:${pct}%"></div>`; presetsEl.after(progDiv); const cancelEl=document.createElement('button'); cancelEl.className='timer-cancel'; cancelEl.id='timer-cancel'; cancelEl.textContent='✕ cancel'; cancelEl.addEventListener('click',()=>{ timerStop(false); updateTimerDOM(); }); progDiv.after(cancelEl); }
  else if(!t.running&&cancelBtn){ const prog=card.querySelector('.timer-progress'); if(prog) prog.remove(); cancelBtn.remove(); }
}
function chime(){ try{ const ctx=new(window.AudioContext||window.webkitAudioContext)(); [[880,0,.15],[1108,.18,.15],[880,.36,.2]].forEach(([freq,start,dur])=>{ const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type='sine'; osc.frequency.setValueAtTime(freq,ctx.currentTime+start); gain.gain.setValueAtTime(0,ctx.currentTime+start); gain.gain.linearRampToValueAtTime(.4,ctx.currentTime+start+.01); gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+start+dur); osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+.05); }); setTimeout(()=>ctx.close(),1000); }catch(e){} }
